<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EDF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>分罐記帳</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="分罐記帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF1;--surface:#F7F9FB;--ink:#16202B;--muted:#5F6E7C;--line:#CFD8E0;--neg:#C2412D;--chip:#DDE4EA;
  --num:"Sora","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10161C;--surface:#1A222A;--ink:#E6ECF1;--muted:#8D9BA8;--line:#2A3540;--neg:#F07A62;--chip:#243039}
}
:root[data-theme="dark"]{--bg:#10161C;--surface:#1A222A;--ink:#E6ECF1;--muted:#8D9BA8;--line:#2A3540;--neg:#F07A62;--chip:#243039}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 120px}
header.top{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 18px}
header.top h1{font-size:22px;margin:0;font-weight:700}
.sync{font-size:12px;color:var(--muted)}

/* jars */
.shelf{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px;scroll-snap-type:x mandatory}
.jarcol{flex:1 0 96px;min-width:96px;scroll-snap-align:start;text-align:center;border:0;background:none;padding:0}
.jar{position:relative;height:168px;margin:0 8px;border:2.5px solid var(--ink);border-radius:16px 16px 30px 30px;overflow:hidden;background:var(--surface)}
.jar::before{content:"";position:absolute;left:14%;right:14%;top:-2px;height:10px;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 8px 8px;background:var(--bg);z-index:2}
.jar.neg{border-color:var(--neg)}
.fill{position:absolute;left:0;right:0;bottom:0;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.fill::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:rgba(255,255,255,.28)}
.jarpct{position:absolute;inset:auto 0 10px 0;font-size:13px;font-weight:600;z-index:3;color:var(--ink);mix-blend-mode:normal}
.jarname{margin-top:10px;font-weight:700;font-size:15px}
.jarbal{font-size:19px;font-weight:600}
.jarbal.neg{color:var(--neg)}
.jarsub{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

.total{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.total span:first-child{color:var(--muted);font-size:14px}
.total b{font-size:20px}

h2{font-size:15px;margin:26px 0 10px;font-weight:700}
.month-row{display:grid;gap:12px}
.mrow .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

/* list */
.txs{list-style:none;margin:0;padding:0}
.day{font-size:13px;color:var(--muted);margin:18px 0 4px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.tx .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--chip);font-size:19px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:500}
.tx .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:600}
.amt.in{color:#2F7D4F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .amt.in{color:#6FCB93}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.empty{padding:28px 0;color:var(--muted);text-align:center;font-size:14px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid transparent;background:var(--chip);border-radius:999px;padding:6px 13px;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);font-weight:600}
input[type=month],input[type=date],input[type=text],input[type=number],select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs button{background:none;border:0;padding:6px 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:11;background:var(--ink);color:var(--bg);border:0;border-radius:18px;padding:14px 20px;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(10,20,30,.25)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:20;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;max-height:92%;overflow:auto;transform:translateY(105%);transition:transform .28s ease;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-in{max-width:560px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{display:flex;align-items:baseline;gap:8px;margin:18px 0 6px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.amount span{font-size:18px;color:var(--muted)}
.amount input{border:0;background:none;font-size:40px;font-family:var(--num);font-weight:600;padding:0;width:100%;outline:none}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:14px}
.cat{border:1.5px solid transparent;background:var(--chip);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.cat .e{font-size:22px}
.cat[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0;min-height:1.3em}
.hint b{color:var(--ink)}
.hint .neg{color:var(--neg);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
label.f{display:block;font-size:13px;color:var(--muted)}
label.f > *{margin-top:4px}
.alloc{margin-top:12px;display:grid;gap:6px}
.alloc div{display:flex;justify-content:space-between;font-size:14px}
.primary{width:100%;margin-top:20px;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px}
.primary:disabled{opacity:.35}
.ghost{background:none;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px}
.danger{color:var(--neg);border-color:var(--neg)}

/* settings */
.set-item{display:grid;grid-template-columns:34px 1fr 78px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.set-item.amt-mode{grid-template-columns:34px 1fr 116px 36px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px}
.mnav button.arr{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;width:42px;height:40px;font-size:18px}
.mnav button.arr:disabled{opacity:.3}
.mlabel{position:relative;font-weight:700;font-size:18px;text-align:center;flex:1}
.mlabel input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.carry{grid-column:2/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:-2px}
.carry input{width:18px;height:18px;accent-color:var(--ink)}
.more{display:block;width:100%;margin-top:10px;text-align:center;background:none;border:0;color:var(--muted);font-size:14px;padding:10px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--ink);color:var(--bg);vertical-align:2px;margin-left:4px}
.jhead{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center}
.jarcard .sub{font-size:13px;font-weight:700;margin-top:4px}
.mem{display:flex;justify-content:space-between;align-items:center;font-size:14px;min-height:32px}
.invrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.set-item.jc{grid-template-columns:52px 1fr 36px;border-bottom:1px solid var(--line)}
.invite{border-color:var(--ink);margin-bottom:12px}
.catgroup{font-size:12px;color:var(--muted);margin:14px 0 -6px}
.pie{display:grid;grid-template-columns:136px 1fr;gap:16px;align-items:center;margin:18px 0 6px}
.pie svg{width:136px;height:136px;display:block}
.pie svg circle.seg{cursor:pointer;transition:stroke-width .15s}
.pie svg circle.seg.dim{opacity:.25}
.legend{display:grid;gap:2px;min-width:0}
.lg{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;background:none;border:0;border-radius:10px;padding:6px 8px;text-align:left;width:100%}
.lg[aria-pressed="true"]{background:var(--chip)}
.lg:disabled{cursor:default}
.lg .sw{width:12px;height:12px;border-radius:4px}
.lg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.lg .vl{font-size:13px;text-align:right;line-height:1.3}
.lg .vl small{display:block;color:var(--muted);font-size:12px}
.pienote{font-size:13px;color:var(--muted);margin:2px 0 0}
.catfilter{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--chip);border:0;border-radius:999px;padding:6px 12px;font-size:13px}
@media (max-width:360px){.pie{grid-template-columns:1fr}.pie svg{margin:0 auto}}
.plan-extra{display:grid;gap:8px;margin-top:10px}
.set-item.cat-item{grid-template-columns:52px 1fr 1fr 36px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line)}
.icon-btn{background:none;border:0;width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:18px}
.pctsum{font-size:13px;margin-top:8px}
.pctsum.bad{color:var(--neg);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:14px}
.toast .undo{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:2px 0}
li.swipe{position:relative;overflow:hidden}
li.swipe .tx{position:relative;z-index:1;background:var(--bg);transition:transform .22s ease;touch-action:pan-y;will-change:transform}
.del-act{position:absolute;top:0;right:0;bottom:1px;width:84px;display:flex}
.del-act button{flex:1;border:0;background:var(--neg);color:#fff;font-weight:700;font-size:15px}
@media (prefers-reduced-motion:reduce){li.swipe .tx{transition:none}}
.hidden{display:none!important}
.note{font-size:13px;color:var(--muted)}
.acct{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.acct .who{font-weight:600;word-break:break-all}
.acct .err{color:var(--neg);font-size:13px;min-height:1.2em}
.acct .btns{display:flex;gap:8px;flex-wrap:wrap}
.acct .btns button{flex:1 1 120px}
.gbtn{background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:11px 14px;font-weight:600}
.or{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>分罐記帳</h1><span class="sync" id="sync">載入中</span></header>
  <main id="view"></main>
</div>

<button class="fab" data-action="open-add">＋ 記一筆</button>

<nav class="tabs" aria-label="主選單">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="6" height="14" rx="2"/><rect x="14" y="6" width="6" height="14" rx="2"/><path d="M5 4h4M15 4h4"/></svg>總覽</button>
  <button data-tab="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>明細</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</nav>

<div class="scrim" id="scrim" data-action="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="記一筆"><div class="sheet-in" id="sheetBody"></div></section>
<div class="toast" id="toast" role="status"></div>

<script>
const PALETTE=['#1F7A80','#D29A17','#8A4F7D','#3D6FB6','#5C8A3A','#C25B3A','#6B6F7A'];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('zh-TW');

function defaults(){
  const inv={id:'b_inv',name:'投資',pct:30,color:PALETTE[0]},day={id:'b_day',name:'日常',pct:50,color:PALETTE[1]},flex={id:'b_flex',name:'彈性',pct:20,color:PALETTE[2]};
  const c=(e,n,b)=>({id:uid(),emoji:e,name:n,bucketId:b.id});
  return {v:1,buckets:[inv,day,flex],categories:[
    c('🍱','餐飲',day),c('🚌','交通',day),c('🛒','日用品',day),c('🏠','居住',day),c('📱','電信',day),
    c('📈','股票/ETF',inv),c('🏦','儲蓄',inv),
    c('🎬','娛樂',flex),c('✈️','旅遊',flex),c('🛍️','購物',flex),c('🎁','禮物',flex)
  ],txns:[]};
}

let S=null;               // state
let tab='home';
let listMonth=today().slice(0,7), listBucket='all', listCat=null;
let draft=null;
const LSK='fenguan-ledger-v1';

/* ---------- local storage ---------- */
function loadLocal(){try{const r=localStorage.getItem(LSK);return r?JSON.parse(r):null}catch(e){return null}}
function saveLocal(){planCache=null;try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function setSync(t){document.getElementById('sync').textContent=t}
const clean=o=>JSON.parse(JSON.stringify(o));

/* ---------- cloud (Firebase) ---------- */
const Cloud={ready:false,user:null,fs:null,auth:null,ref:null,unsubs:[],metaTimer:null,err:'',busy:false,
  ledgerLoaded:false,jars:{},jarTxns:{},jarLoaded:{},jarUnsubs:{},jarsUnsub:null,inviteUnsubs:[],invites:[],sent:[],jarTimers:{},jarsLoaded:false};
function cloudConfigured(){return !!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&window.firebase)}
function cloudOn(){return !!(Cloud.user&&Cloud.ref)}
function syncStatus(){
  if(!cloudConfigured()||!Cloud.user){setSync('僅存於此裝置');return}
  if(!Cloud.ref){setSync('連線中…');return}
  if(!navigator.onLine){setSync('離線中，連線後自動同步');return}
  setSync('同步中…');
  Cloud.fs.waitForPendingWrites().then(()=>{if(cloudOn())setSync(navigator.onLine?'已同步':'離線中，連線後自動同步')}).catch(()=>{});
}
window.addEventListener('online',syncStatus);window.addEventListener('offline',syncStatus);

function cloudInit(){
  if(!cloudConfigured())return;
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    Cloud.auth=firebase.auth();Cloud.fs=firebase.firestore();
    Cloud.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    Cloud.ready=true;
    Cloud.auth.onAuthStateChanged(u=>{
      Cloud.user=u||null;
      if(u)cloudConnect().catch(e=>{Cloud.err='雲端連線失敗：'+(e.message||e.code);renderIfSettings();syncStatus()});
      else{cloudStop();syncStatus();renderIfSettings()}
    });
  }catch(e){Cloud.err='Firebase 設定有誤：'+e.message}
}
function cloudStop(){
  Cloud.unsubs.forEach(f=>{try{f()}catch(e){}});Cloud.unsubs=[];Cloud.ref=null;Cloud.ledgerLoaded=false;
  stopJars();
}

async function writeTxns(ref,txns){
  for(let i=0;i<txns.length;i+=400){
    const b=Cloud.fs.batch();
    txns.slice(i,i+400).forEach(t=>{const {id,...rest}=t;b.set(ref.collection('txns').doc(id),clean(rest))});
    await b.commit();
  }
}
async function deleteAllTxns(ref){
  const qs=await ref.collection('txns').get();
  for(let i=0;i<qs.docs.length;i+=400){const b=Cloud.fs.batch();qs.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
}

async function cloudConnect(){
  const u=Cloud.user;Cloud.err='';syncStatus();
  const col=Cloud.fs.collection('ledgers');
  let lid=null;
  if(S.ledgerId&&S.ledgerOwner===u.uid){lid=S.ledgerId}
  else{
    const q=await col.where('members','array-contains',u.uid).get();
    if(q.empty){
      const ref=col.doc();
      await ref.set({name:'我的帳本',owner:u.uid,members:[u.uid],buckets:clean(S.buckets),categories:clean(S.categories),allocMode:S.allocMode||'pct',remainderId:S.remainderId||null,jarPlan:clean(S.jarPlan||{}),
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      await writeTxns(ref,S.txns);
      lid=ref.id;toast('已把這台裝置的資料上傳到雲端');
    }else{
      lid=q.docs[0].id;
      if(S.txns.length>0&&S.ledgerId!==lid){
        const ok=confirm(`這個帳號在雲端已經有帳本了。\n\n要改用雲端帳本嗎？這台裝置上的 ${S.txns.length} 筆紀錄會先下載成備份檔。\n\n按「取消」會登出，保留這台裝置的資料。`);
        if(!ok){await Cloud.auth.signOut();return}
        exportData();
      }
    }
  }
  S.ledgerId=lid;S.ledgerOwner=u.uid;saveLocal();
  subscribe(col.doc(lid));
}

function subscribe(ref){
  cloudStop();Cloud.ref=ref;
  const fail=e=>{ // ledger gone or no access: forget it and look again
    cloudStop();
    if(e&&e.code==='permission-denied'){S.ledgerId=null;saveLocal();cloudConnect().catch(()=>{})}
    else{Cloud.err='同步中斷：'+(e.message||e.code);renderIfSettings();syncStatus()}
  };
  Cloud.unsubs.push(ref.onSnapshot(snap=>{
    if(!snap.exists){fail({code:'permission-denied'});return}
    if(snap.metadata.hasPendingWrites)return;
    const d=snap.data();
    S.buckets=d.buckets||[];S.categories=d.categories||[];S.allocMode=d.allocMode||'pct';S.remainderId=d.remainderId||null;S.jarPlan=d.jarPlan||{};S.ledgerName=d.name||'我的帳本';
    const mig=migrateJarPlan();saveLocal();safeRender();if(mig)persist();
    if(!Cloud.ledgerLoaded){Cloud.ledgerLoaded=true;startJars()}
    scheduleMirror();
  },fail));
  Cloud.unsubs.push(ref.collection('txns').onSnapshot(qs=>{
    S.txns=qs.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
    saveLocal();safeRender();syncStatus();scheduleMirror();
  },fail));
  renderIfSettings();syncStatus();
}

/* re-render without stealing focus from a field being edited */
let renderQueued=false;
function safeRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#view')&&/INPUT|SELECT/.test(a.tagName)){renderQueued=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(renderQueued){setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('#view')&&/INPUT|SELECT/.test(a.tagName))){renderQueued=false;render()}},0)}});
function renderIfSettings(){if(tab==='settings')safeRender()}

const FV=()=>firebase.firestore.FieldValue;
const myUid=()=>Cloud.user&&Cloud.user.uid;
const myEmail=()=>((Cloud.user&&Cloud.user.email)||'').toLowerCase();
const myName=()=>(Cloud.user&&(Cloud.user.displayName||(Cloud.user.email||'').split('@')[0]))||'我';
const jarsList=()=>Object.keys(Cloud.jars).map(id=>Object.assign({id},Cloud.jars[id])).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const isMirror=t=>t.kind==='contrib'||(t.id||'').startsWith('m_');
function nameOf(id){if(isSJ(id)){const j=Cloud.jars[sjId(id)];return (j?j.name:((S.jarPlan||{})[sjId(id)]||{}).name||'共用罐')+'（共用）'}const b=bucketById(id);return b?b.name:'—'}
function colorOf(id){if(isSJ(id)){const j=Cloud.jars[sjId(id)];return j?j.color:'#999'}const b=bucketById(id);return b?b.color:'#999'}

function stopJars(){
  if(Cloud.jarsUnsub){try{Cloud.jarsUnsub()}catch(e){}}Cloud.jarsUnsub=null;
  for(const id in Cloud.jarUnsubs){try{Cloud.jarUnsubs[id]()}catch(e){}}
  Cloud.inviteUnsubs.forEach(f=>{try{f()}catch(e){}});
  Object.assign(Cloud,{jars:{},jarTxns:{},jarLoaded:{},jarUnsubs:{},inviteUnsubs:[],invites:[],sent:[],jarsLoaded:false});
}
function startJars(){
  if(!cloudOn()||Cloud.jarsUnsub)return;
  const uidv=myUid();
  Cloud.jarsUnsub=Cloud.fs.collection('jars').where('members','array-contains',uidv).onSnapshot(qs=>{
    const seen={};
    qs.docs.forEach(d=>{
      seen[d.id]=1;
      if(!(d.metadata.hasPendingWrites&&Cloud.jars[d.id]))Cloud.jars[d.id]=d.data();
      if(!Cloud.jarUnsubs[d.id])watchJarTxns(d.id);
    });
    for(const id in Cloud.jars)if(!seen[id]){delete Cloud.jars[id];if(Cloud.jarUnsubs[id]){Cloud.jarUnsubs[id]();delete Cloud.jarUnsubs[id]}delete Cloud.jarTxns[id];delete Cloud.jarLoaded[id]}
    // keep my contribution plan in step with membership
    let changed=false;S.jarPlan=S.jarPlan||{};
    for(const id in Cloud.jars){const jp=S.jarPlan[id];
      if(!jp){S.jarPlan[id]={from:curMonth(),hist:[{m:curMonth(),amt:0,src:defaultSrc()}],name:Cloud.jars[id].name};changed=true}
      else if(jp.until||jp.name!==Cloud.jars[id].name){if(jp.until&&jp.until<=curMonth())jp.from=curMonth();delete jp.until;jp.name=Cloud.jars[id].name;changed=true}}
    if(!qs.metadata.fromCache){
      for(const id in S.jarPlan){if(!Cloud.jars[id]&&!S.jarPlan[id].until){S.jarPlan[id].until=shiftMonth(curMonth(),1);changed=true}}
    }
    Cloud.jarsLoaded=true;
    if(changed)persist();
    safeRender();scheduleMirror();
  },e=>{Cloud.err='共用罐同步中斷：'+(e.code||e.message);renderIfSettings()});
  watchInvites();
}
function watchJarTxns(jid){
  Cloud.jarUnsubs[jid]=Cloud.fs.collection('jars').doc(jid).collection('txns').onSnapshot(qs=>{
    Cloud.jarTxns[jid]=qs.docs.map(d=>Object.assign({},d.data(),{id:d.id,jid}));
    Cloud.jarLoaded[jid]=true;safeRender();scheduleMirror();
  },()=>{});
}
function watchInvites(){
  Cloud.inviteUnsubs.forEach(f=>{try{f()}catch(e){}});Cloud.inviteUnsubs=[];
  const col=Cloud.fs.collection('invites');
  Cloud.inviteUnsubs.push(col.where('owner','==',myUid()).onSnapshot(qs=>{Cloud.sent=qs.docs.map(d=>Object.assign({id:d.id},d.data()));renderIfSettings()},()=>{}));
  if(Cloud.user.emailVerified&&myEmail()){
    Cloud.inviteUnsubs.push(col.where('email','==',myEmail()).onSnapshot(qs=>{Cloud.invites=qs.docs.map(d=>Object.assign({id:d.id},d.data()));safeRender()},()=>{}));
  }
}

/* contributions and transfers I make are mirrored into the shared jar so every member sees them */
function desiredMirrors(jid){
  const me=myUid(),nm=myName(),key=SJ+jid,jp=(S.jarPlan||{})[jid],res={};
  if(jp&&jp.from)for(let mk=jp.from;mk<=curMonth();mk=shiftMonth(mk,1)){const c=jarContrib(jp,mk);
    if(c)res['contrib_'+me+'_'+mk]={kind:'contrib',amount:c.amt,date:mk+'-01',note:'',by:me,byName:nm,src:nameOf(c.src),srcId:c.src}}
  for(const t of S.txns){
    if(t.type==='transfer'&&t.to===key)res['m_'+t.id]={kind:'in',amount:t.amount,date:t.date,note:t.note||'',by:me,byName:nm,src:nameOf(t.from)};
    else if(t.type==='transfer'&&t.from===key)res['m_'+t.id]={kind:'withdraw',amount:t.amount,date:t.date,note:t.note||'',by:me,byName:nm,src:nameOf(t.to)};
    else if(t.type==='income'&&t.mode==='one'&&t.target===key)res['m_'+t.id]={kind:'in',amount:t.amount,date:t.date,note:t.note||'收入',by:me,byName:nm,src:''};
  }
  return res;
}
let mirrorTimer=null;
function scheduleMirror(){clearTimeout(mirrorTimer);mirrorTimer=setTimeout(syncMirrors,1200)}
function syncMirrors(){
  if(!cloudOn()||!Cloud.ledgerLoaded||!Cloud.jarsLoaded)return;
  const me=myUid(),sig=t=>[t.kind,t.amount,t.date,t.note||'',t.byName||'',t.src||'',t.srcId||''].join('|');
  for(const jid in Cloud.jars){
    if(!Cloud.jarLoaded[jid])continue;
    const want=desiredMirrors(jid),have={};
    (Cloud.jarTxns[jid]||[]).forEach(t=>{if(t.by===me&&isMirror(t))have[t.id]=t});
    const col=Cloud.fs.collection('jars').doc(jid).collection('txns');
    for(const id in want)if(!have[id]||sig(have[id])!==sig(want[id]))col.doc(id).set(want[id]).catch(()=>{});
    for(const id in have)if(!want[id])col.doc(id).delete().catch(()=>{});
  }
}

async function deleteJar(jid){
  const j=Cloud.jars[jid];if(!j)return;
  if(!confirm(`確定刪除「${j.name}」？\n\n罐子和裡面所有人的紀錄都會刪除，無法復原。罐子裡如果還有錢，建議先轉回各自的罐子。`))return;
  try{
    const ref=Cloud.fs.collection('jars').doc(jid);
    const qs=await ref.collection('txns').get();
    for(let i=0;i<qs.docs.length;i+=400){const b=Cloud.fs.batch();qs.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
    for(const inv of Cloud.sent.filter(x=>x.jid===jid))await Cloud.fs.collection('invites').doc(inv.id).delete();
    await ref.delete();
    if(S.jarPlan[jid])S.jarPlan[jid].until=shiftMonth(curMonth(),1);

const AUTH_MSG={'auth/invalid-email':'Email 格式不正確','auth/invalid-credential':'Email 或密碼不正確','auth/wrong-password':'Email 或密碼不正確','auth/user-not-found':'找不到這個帳號，請先建立帳號','auth/email-already-in-use':'這個 Email 已經註冊過，請直接登入','auth/weak-password':'密碼至少需要 6 個字元','auth/popup-blocked':'登入視窗被擋住了，請允許彈出視窗後再試','auth/popup-closed-by-user':'登入視窗已關閉','auth/unauthorized-domain':'這個網址還沒加入 Firebase 的授權網域','auth/operation-not-allowed':'Firebase 還沒開啟這種登入方式','auth/network-request-failed':'需要網路連線才能登入','auth/too-many-requests':'嘗試次數太多，請稍後再試'};

function setAllocMode(m){
  if(S.allocMode===m||(m==='pct'&&!S.allocMode))return;
  let filled=false;
  if(m==='amount'&&planSum()===0){ // first switch: suggest amounts from the latest month's income
    const pt=planTotals(),mk=Object.keys(pt).sort().pop(),T=mk?pt[mk]:0;
    const tot=targets().reduce((a,b)=>a+b.pct,0)||1;
    if(T>0){S.buckets.forEach(b=>b.amt=Math.round(T*(+b.pct||0)/tot/100)*100);filled=true}
    if(!bucketById(S.remainderId))S.remainderId=(S.buckets.find(b=>/彈性/.test(b.name))||S.buckets[S.buckets.length-1]).id;
  }
  S.allocMode=m;persist();render();
  if(filled)toast('已依最近一個月的收入先填入建議金額，可以再調整');
}
function migrate(){
  for(const t of S.txns){
    if(t.type!=='income'||t.mode)continue;
    const ks=Object.keys(t.alloc||{}).filter(k=>t.alloc[k]);
    const active=S.buckets.filter(b=>+b.pct>0).length;
    if(ks.length===1&&active>1){t.mode='one';t.target=ks[0]}else t.mode='pct';
    delete t.alloc;
  }
}
function init(){
  S=loadLocal()||defaults();
  migrate();migrateJarPlan();saveLocal();
  render();
  syncStatus();
  cloudInit();
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='分罐記帳備份-'+today()+'.json';

function exportCSV(){
  const rows=[['日期','類型','金額','分類','罐子','備註']];
  for(const t of [...S.txns].sort((a,b)=>a.date<b.date?-1:1)){
    if(t.type==='expense'){const c=catById(t.catId),b=bucketById(t.bucketId);rows.push([t.date,'支出',t.amount,c?c.name:'',b?b.name:'',t.note])}
    else if(t.type==='income'){rows.push([t.date,'收入',t.amount,'',Object.entries(incAlloc(t)).filter(([,v])=>v).map(([k,v])=>nameOf(k)+' '+v).join('；'),t.note])}
    else rows.push([t.date,'轉移',t.amount,'',nameOf(t.from)+'→'+nameOf(t.to),t.note]);
  }
  const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='分罐記帳-'+today()+'.csv';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.buckets||!d.categories||!d.txns)throw 0;
    if(!confirm(cloudOn()?'用備份檔取代目前所有資料？雲端帳本也會一起被取代。':'用備份檔取代目前所有資料？'))return;replaceAll(d);toast('已還原備份')}catch(e){toast('這不是有效的備份檔')}};
  r.readAsText(file);
}

/* ---------- calculations ---------- */
const bucketById=id=>S.buckets.find(b=>b.id===id);
const catById=id=>S.categories.find(c=>c.id===id);
const SJ='sj:';
const isSJ=id=>typeof id==='string'&&id.startsWith(SJ);
const sjId=id=>id.slice(SJ.length);
const jarActive=(jp,mk)=>!!jp&&(!jp.from||mk>=jp.from)&&(!jp.until||mk<jp.until);
function targets(mk){return S.buckets.map(b=>({id:b.id,pct:+b.pct||0,amt:+b.amt||0}))}
// my contribution plan for a shared jar: hist = [{m:'YYYY-MM', amt, src}] — each entry applies from its month on
function defaultSrc(){const b=S.buckets.find(b=>/日常/.test(b.name))||S.buckets.find(b=>!isRemainder(b))||S.buckets[0];return b?b.id:null}
function jarEff(jp,mk){if(!jp||!jp.hist)return null;let e=null;for(const x of jp.hist)if(x.m<=mk)e=x;return e}
function jarContrib(jp,mk){ // {amt,src} actually moved in month mk (never beyond the current month)
  if(!jarActive(jp,mk)||mk>curMonth())return null;
  const e=jarEff(jp,mk);if(!e||!(+e.amt>0)||!bucketById(e.src))return null;
  return {amt:+e.amt,src:e.src};
}
function setJarPlan(jid,field,val){ // changes take effect from the current month; past months keep their amount
  const jp=(S.jarPlan||{})[jid];if(!jp)return;
  jp.hist=jp.hist||[];const m=curMonth(),last=jp.hist[jp.hist.length-1];
  const base=jarEff(jp,m)||{amt:0,src:defaultSrc()};
  if(last&&last.m===m)last[field]=val;
  else jp.hist.push(Object.assign({m:(jp.from&&jp.from>m)?jp.from:m,amt:base.amt,src:base.src},{[field]:val}));
}
function migrateJarPlan(){
  let changed=false;
  for(const jid in (S.jarPlan||{})){const jp=S.jarPlan[jid];
    if(!jp.hist){jp.hist=[{m:jp.from||curMonth(),amt:+jp.amt||0,src:defaultSrc()}];delete jp.amt;delete jp.pct;changed=true}}
  return changed;
}
function allocate(amount,mode,target,mk){
  const res={};
  if(mode==='one'){res[target]=amount;return res}
  const ts=targets(mk),tot=ts.reduce((a,b)=>a+b.pct,0)||1;
  let rem=amount;
  ts.forEach((b,i)=>{const v=i===ts.length-1?rem:Math.round(amount*b.pct/tot);res[b.id]=v;rem-=v});
  return res;
}
const isPlan=t=>t.type==='income'&&t.mode!=='one';
let planCache=null;
function planTotals(excludeId){ // month -> total of plan-following income
  if(!excludeId&&planCache)return planCache;
  const m={};
  for(const t of S.txns){if(isPlan(t)&&t.id!==excludeId){const k=t.date.slice(0,7);m[k]=(m[k]||0)+t.amount}}
  if(!excludeId)planCache=m;
  return m;
}
const planSum=mk=>targets(mk).reduce((a,b)=>a+Math.max(0,b.amt),0);
function remainderBucket(){return bucketById(S.remainderId)||S.buckets[S.buckets.length-1]}
function planAlloc(T,mk){ // how one month's plan income is split
  const ts=targets(mk),res={};ts.forEach(b=>res[b.id]=0);
  if(T<=0||!S.buckets.length)return res;
  if(S.allocMode!=='amount')return Object.assign(res,allocate(T,'pct',null,mk));
  const rid=remainderBucket().id,P=planSum(mk);
  if(P<=0){res[rid]=T;return res}
  if(T>=P){ts.forEach(b=>res[b.id]=Math.max(0,b.amt));res[rid]+=T-P;return res}
  const bs=ts.filter(b=>b.amt>0);let rem=T;
  bs.forEach((b,i)=>{const v=i===bs.length-1?rem:Math.round(T*b.amt/P);res[b.id]=v;rem-=v});
  return res;
}
function incAlloc(t){ // this income's share of its month
  if(t.mode==='one')return {[t.target]:t.amount};
  const mk=t.date.slice(0,7),T=planTotals()[mk]||t.amount,a=planAlloc(T,mk),r={};
  for(const k in a)r[k]=Math.round(a[k]*t.amount/T);
  return r;
}
const curMonth=()=>today().slice(0,7);
function shiftMonth(mk,d){const [y,m]=mk.split('-').map(Number);const dt=new Date(y,m-1+d,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')}
const isRemainder=b=>!!b&&remainderBucket()&&remainderBucket().id===b.id;
const carries=b=>b.carry!==false||isRemainder(b); // the designated jar always carries
// balances for one month: open (carried in) + this month's in − out
function stats(excludeId,month){
  month=month||curMonth();
  const per={};S.buckets.forEach(b=>per[b.id]={});
  const add=(id,mk,f,v)=>{const p=per[id];if(!p)return;(p[mk]||(p[mk]={i:0,o:0,j:0}))[f]+=v};
  for(const t of S.txns){
    if(t.id===excludeId)continue;
    const mk=t.date.slice(0,7);if(mk>month)continue;
    if(t.type==='income'){if(t.mode==='one')add(t.target,mk,'i',t.amount)}
    else if(t.type==='expense')add(t.bucketId,mk,'o',t.amount);
    else if(t.type==='transfer'){add(t.from,mk,'o',t.amount);add(t.to,mk,'i',t.amount)}
  }
  const pt=planTotals(excludeId);
  for(const mk in pt){if(mk>month)continue;const a=planAlloc(pt[mk],mk);for(const k in a)if(a[k])add(k,mk,'i',a[k])}
  for(const jid in (S.jarPlan||{})){const jp=S.jarPlan[jid];
    for(let mk=jp.from||month;mk<=month;mk=shiftMonth(mk,1)){const c=jarContrib(jp,mk);if(c){add(c.src,mk,'o',c.amt);add(c.src,mk,'j',c.amt)}}}
  // walk month by month: carrying jars keep their balance; reset jars settle at month end into the designated jar
  const rem=remainderBucket();
  const months=new Set([month]);for(const id in per)for(const mk in per[id])months.add(mk);
  const bal={},out={};S.buckets.forEach(b=>bal[b.id]=0);
  let lastSweep=0;
  for(const mk of [...months].sort()){
    const isTarget=mk===month;
    for(const b of S.buckets){
      const cur=per[b.id][mk]||{i:0,o:0,j:0};
      if(isTarget)out[b.id]={open:bal[b.id],monthIn:cur.i,monthOut:cur.o,monthJar:cur.j,bal:bal[b.id]+cur.i-cur.o,sweep:0};
      bal[b.id]+=cur.i-cur.o;
    }
    if(isTarget)break;
    let sweep=0;
    for(const b of S.buckets){if(!carries(b)){sweep+=bal[b.id];bal[b.id]=0}}
    if(rem)bal[rem.id]+=sweep;
    lastSweep=sweep;
  }
  if(rem&&out[rem.id])out[rem.id].sweep=lastSweep;
  return out;
}

const jarIn=t=>t.kind==='contrib'||t.kind==='in';
function jarStats(jid,month,excludeId){ // shared jars always carry over
  month=month||curMonth();let open=0,mi=0,mo=0;
  for(const t of (Cloud.jarTxns[jid]||[])){
    if(t.id===excludeId)continue;
    const mk=t.date.slice(0,7);if(mk>month)continue;
    const v=jarIn(t)?t.amount:-t.amount;
    if(mk<month)open+=v;else if(jarIn(t))mi+=t.amount;else mo+=t.amount;
  }
  return {open,monthIn:mi,monthOut:mo,bal:open+mi-mo};
}
function balanceOf(id,month,excludeId){return isSJ(id)?jarStats(sjId(id),month,excludeId).bal:(stats(excludeId,month)[id]||{bal:0}).bal}

function monthNav(){
  const [y,m]=listMonth.split('-').map(Number);
  const latest=S.txns.reduce((a,t)=>t.date.slice(0,7)>a?t.date.slice(0,7):a,curMonth());
  return `<div class="mnav"><button class="arr" data-action="mshift" data-d="-1" aria-label="上個月">‹</button>
    <div class="mlabel">${y} 年 ${m} 月<input type="month" id="hm" value="${listMonth}" aria-label="選擇月份"></div>
    <button class="arr" data-action="mshift" data-d="1" aria-label="下個月" ${listMonth>=latest?'disabled':''}>›</button></div>`;
}
function jarCol(id,name,color,s,sub,shared){
  const avail=Math.max(0,s.open)+s.monthIn,ratio=avail>0?Math.max(0,Math.min(1,s.bal/avail)):0;
  return `<button class="jarcol" data-action="jump" data-bucket="${id}" aria-label="${esc(name)}，月底餘額 ${money(s.bal)}">
    <div class="jar ${s.bal<0?'neg':''}"><div class="fill" style="height:${(ratio*100).toFixed(1)}%;background:${color}"></div>
    <div class="jarpct num">${avail>0?Math.round(ratio*100)+'%':'空'}</div></div>
    <div class="jarname">${esc(name)}${shared?'<span class="pill">共用</span>':''}</div>
    <div class="jarbal num ${s.bal<0?'neg':''}">${money(s.bal)}</div>
    <div class="jarsub">${sub}</div></button>`;
}
// my share of a shared expense: split by the member count when it was recorded
function myShare(t){const n=t.split||((Cloud.jars[t.jid]||{}).members||[]).length||1;return Math.round(t.amount/n)}
function sharedMonth(month){ // shared expenses this month: total and my share
  let total=0,share=0;
  for(const j of jarsList())for(const t of (Cloud.jarTxns[j.id]||[]))if(t.kind==='expense'&&t.date.slice(0,7)===month){total+=t.amount;share+=myShare(t)}
  return {total,share};
}
function monthRow(name,color,s,shared,jid){
  const avail=Math.max(0,s.open)+s.monthIn;
  const spent=s.monthOut-(s.monthJar||0),used=s.monthOut,base=Math.max(avail,used,1);
  let lab;
  if(shared){const sm=jarShare(jid,listMonth);lab=`共用支出 ${money(s.monthOut)}（你的份額 ${money(sm)}）／ 可用 ${money(avail)}`}
  else lab=`花了 ${money(spent)}${s.monthJar?`・撥共用 ${money(s.monthJar)}`:''} ／ 可用 ${money(avail)}`;
  const jarW=s.monthJar?Math.min(100,s.monthJar/base*100):0,spW=Math.min(100-jarW,Math.max(0,spent)/base*100);
  return `<div class="mrow"><div class="lab"><span><span class="dot" style="background:${color}"></span>${esc(name)}${shared?'（共用）':''}</span><span class="num">${lab}</span></div>
  <div class="bar" style="display:flex">${jarW?`<i style="width:${jarW}%;background:${color};opacity:.45;border-radius:4px 0 0 4px"></i>`:''}<i style="width:${spW}%;background:${used>avail?'var(--neg)':color};${jarW?'border-radius:0 4px 4px 0':''}"></i></div></div>`;
}
function jarShare(jid,month){let s=0;for(const t of (Cloud.jarTxns[jid]||[]))if(t.kind==='expense'&&t.date.slice(0,7)===month)s+=myShare(t);return s}
// records for a month: my own records + shared-jar records.
// My mirrored transfers already appear as my own transfers; my monthly contribution shows under its source jar.
function monthItems(month,filter){
  const me=myUid();filter=filter||'all';
  let own=[],sh=[];
  if(!isSJ(filter)){
    const rel=t=>filter==='all'||(t.type==='expense'&&t.bucketId===filter)||(t.type==='income'&&incAlloc(t)[filter])||(t.type==='transfer'&&(t.from===filter||t.to===filter));
    own=S.txns.filter(t=>t.date.slice(0,7)===month&&rel(t));
  }
  for(const j of jarsList()){
    if(isSJ(filter)&&sjId(filter)!==j.id)continue;
    for(const t of (Cloud.jarTxns[j.id]||[])){
      if(t.date.slice(0,7)!==month)continue;
      if(!isSJ(filter)){
        const mineContrib=t.by===me&&t.kind==='contrib';
        if(filter!=='all'){if(!(mineContrib&&t.srcId===filter))continue}
        else if(t.by===me&&isMirror(t)&&!mineContrib)continue;
      }
      sh.push(t);
    }
  }
  return own.concat(sh).sort(sortTx);
}
function homeView(){
  const st=stats(null,listMonth);
  const jars=S.buckets.map(b=>{
    const s=st[b.id];
    const sub=!carries(b)?'每月歸零':s.sweep?`上月結轉 ${money(s.open)}<br>含歸零罐結算 ${s.sweep<0?'−':'+'}${money(Math.abs(s.sweep))}`:(s.open?`上月結轉 ${money(s.open)}`:'會結轉');
    return jarCol(b.id,b.name,b.color,s,sub,false)}).join('');
  const shared=jarsList();
  const sjars=shared.map(j=>{const s=jarStats(j.id,listMonth);return jarCol(SJ+j.id,j.name,j.color,s,`${(j.members||[]).length} 人共用`+(s.open?`<br>上月結轉 ${money(s.open)}`:''),true)}).join('');
  const total=S.buckets.reduce((a,b)=>a+st[b.id].bal,0);
  const monthRows=S.buckets.map(b=>monthRow(b.name,b.color,st[b.id],false)).join('')+shared.map(j=>monthRow(j.name,j.color,jarStats(j.id,listMonth),true,j.id)).join('');
  const own=S.txns.filter(t=>t.type==='expense'&&t.date.slice(0,7)===listMonth).reduce((a,t)=>a+t.amount,0),sm=sharedMonth(listMonth);
  const items=monthItems(listMonth,'all');
  const isNow=listMonth===curMonth();
  const any=S.txns.length||shared.length;
  const empty=!any?`<div class="empty">先記一筆收入，錢會依計畫分進各個罐子。</div>`:'';
  return `${cloudOn()?invitesHtml():''}${monthNav()}<div class="shelf">${jars}${sjars}</div>
  <div class="total"><span>${isNow?'目前':'月底'}${shared.length?'我的罐子':'所有罐子'}合計</span><b class="num ${total<0?'neg':''}">${money(total)}</b></div>
  ${empty}
  ${any?`<div class="total" style="margin-top:0;border-top:0"><span>這個月支出</span><span class="num"><b>${money(own+sm.share)}</b>${shared.length?`<br><span class="note">個人 ${money(own)}＋共用份額 ${money(sm.share)}</span>`:''}</span></div>
  <h2>這個月各罐</h2><div class="month-row">${monthRows}</div>
  <h2>這個月的紀錄</h2>${items.length?`<ul class="txs">${items.slice(0,8).map(rowOf).join('')}</ul>${items.length>8?`<button class="more" data-action="tolist">查看這個月全部 ${items.length} 筆 ›</button>`:''}`:'<div class="empty">這個月還沒有紀錄。</div>'}`:''}`;
}
const rowOf=t=>t.jid?sharedRow(t):txRow(t);
const delAct=ref=>`<div class="del-act"><button data-action="swdel" data-ref="${esc(ref)}" tabindex="-1">刪除</button></div>`;
function sharedRow(t,noSwipe){
  const j=Cloud.jars[t.jid]||{};const me=myUid();
  let ic='🧾',t1='',sign='−',cls='';
  if(t.kind==='expense'){ic=t.emoji||'🧾';t1=t.catName||'支出'}
  else if(t.kind==='contrib'){ic='🫙';t1='每月撥款';sign='+';cls='in'}
  else if(t.kind==='in'){ic='💵';t1=t.note||'投入';sign='+';cls='in'}
  else{ic='🔁';t1='從共用罐轉出'}
  const who=t.by===me?'你':(t.byName||'成員');
  const extra=((t.kind==='in'||t.kind==='contrib')&&t.src?'從'+esc(t.src)+'・':'')+(t.kind==='withdraw'&&t.src?'到'+esc(t.src)+'・':'')+(t.note&&t.kind!=='in'?esc(t.note)+'・':'');
  const canDel=!noSwipe&&t.by===me&&(t.kind==='expense'||((t.id||'').startsWith('m_')&&S.txns.some(x=>x.id===t.id.slice(2))));
  const ref=t.kind==='expense'?'s:'+t.jid+':'+t.id:'p:'+(t.id||'').slice(2);
  return `<li${canDel?` class="swipe"`:''}>${canDel?delAct(ref):''}<button class="tx" data-action="stx" data-jid="${t.jid}" data-id="${esc(t.id)}"><span class="ic">${ic}</span><span class="mid"><div class="t1">${esc(t1)}</div>
    <div class="t2"><span class="dot" style="background:${j.color||'#999'}"></span>${esc(j.name||'共用罐')}（共用）・${extra}${esc(who)}${t.kind==='expense'?'・你的份額 '+money(myShare(t)):''}</div></span><span class="amt num ${cls}">${sign}${money(t.amount)}</span></button></li>`;
}
function sortTx(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0)}
function txRow(t){
  let ic='💵',t1='',t2='',amt='',cls='';
  if(t.type==='expense'){const c=catById(t.catId);const b=bucketById(t.bucketId);ic=c?c.emoji:'🧾';t1=c?c.name:'已刪除分類';t2=`<span class="dot" style="background:${b?b.color:'#999'}"></span>${esc(b?b.name:'—')}${t.note?'｜'+esc(t.note):''}`;amt='−'+money(t.amount)}
  else if(t.type==='income'){t1=t.note||'收入';t2=(t.mode==='one'?'全部放入・':(S.allocMode==='amount'?'依計畫・':'依比例・'))+Object.entries(incAlloc(t)).filter(([,v])=>v).map(([k,v])=>`${esc(nameOf(k))} ${money(v)}`).join('、');amt='+'+money(t.amount);cls='in'}
  else{ic='🔁';t1=`${nameOf(t.from)} → ${nameOf(t.to)}`;t2=t.note?esc(t.note):'罐子間轉移';amt=money(t.amount)}
  return `<li class="swipe">${delAct('p:'+t.id)}<button class="tx" data-action="tx" data-id="${t.id}"><span class="ic">${ic}</span><span class="mid"><div class="t1">${esc(t1)}</div><div class="t2">${t2}</div></span><span class="amt num ${cls}">${amt}</span></button></li>`;
}
const CAT_COLORS=['#1F7A80','#D29A17','#8A4F7D','#3D6FB6','#5C8A3A','#C25B3A'];
// slices for the pie: 'all' = spending per jar (my share for shared jars); a jar = spending per category
function pieData(){
  const m=listMonth,me=myUid();let slices=[],note='',kind;
  if(listBucket==='all'){
    kind='jar';
    for(const b of S.buckets){const v=S.txns.filter(t=>t.type==='expense'&&t.bucketId===b.id&&t.date.slice(0,7)===m).reduce((a,t)=>a+t.amount,0);
      if(v)slices.push({key:b.id,name:b.name,color:b.color,value:v})}
    for(const j of jarsList()){const v=jarShare(j.id,m);if(v)slices.push({key:SJ+j.id,name:j.name+'（你的份額）',color:j.color,value:v})}
    const toJar=S.buckets.reduce((a,b)=>a+((stats(null,m)[b.id]||{}).monthJar||0),0);
    if(toJar)note=`另撥到共用罐 ${money(toJar)}，不計入圖表`;
  }else{
    kind='cat';const g={};
    if(isSJ(listBucket)){
      for(const t of (Cloud.jarTxns[sjId(listBucket)]||[]))if(t.kind==='expense'&&t.date.slice(0,7)===m){
        const k=t.catKey||t.catName||'?';(g[k]=g[k]||{key:k,name:t.catName||'支出',emoji:t.emoji||'🧾',value:0,count:0});g[k].value+=t.amount;g[k].count++}
    }else{
      for(const t of S.txns)if(t.type==='expense'&&t.bucketId===listBucket&&t.date.slice(0,7)===m){
        const c=catById(t.catId),k=t.catId||'?';(g[k]=g[k]||{key:k,name:c?c.name:'已刪除分類',emoji:c?c.emoji:'🧾',value:0,count:0});g[k].value+=t.amount;g[k].count++}
      const mj=(stats(null,m)[listBucket]||{}).monthJar||0;
      if(mj)note=`另撥到共用罐 ${money(mj)}，不計入圖表`;
    }
    slices=Object.values(g);
  }
  slices.sort((a,b)=>b.value-a.value);
  if(slices.length>6){const rest=slices.slice(5);slices=slices.slice(0,5).concat([{key:null,name:`其他 ${rest.length} 項`,value:rest.reduce((a,s)=>a+s.value,0),count:rest.reduce((a,s)=>a+(s.count||0),0),other:true}])}
  slices.forEach((s,i)=>{if(!s.color)s.color=s.other?'#9AA5B1':CAT_COLORS[i%CAT_COLORS.length]});
  return {kind,slices,note,total:slices.reduce((a,s)=>a+s.value,0)};
}
function pieHtml(){
  const {kind,slices,note,total}=pieData();
  if(!total)return `<div class="empty" style="padding:18px 0 4px">這個月沒有支出${note?`<div class="pienote">${note}</div>`:''}</div>`;
  const R=46,C=2*Math.PI*R;let acc=0;
  const segs=slices.map(s=>{const len=s.value/total*C,gap=slices.length>1?Math.min(1.2,len/3):0;
    const el=`<circle class="seg ${listCat&&listCat!==s.key?'dim':''}" cx="60" cy="60" r="${R}" fill="none" stroke="${s.color}" stroke-width="18"
      stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-acc}" ${s.other?'':`data-action="pie" data-key="${esc(s.key)}"`}><title>${esc(s.name)} ${money(s.value)}</title></circle>`;
    acc+=len;return el}).join('');
  const legend=slices.map(s=>{const pct=Math.round(s.value/total*100);
    return `<button class="lg" ${s.other?'disabled':`data-action="pie" data-key="${esc(s.key)}"`} aria-pressed="${!!listCat&&listCat===s.key}">
      <span class="sw" style="background:${s.color}"></span><span class="nm">${s.emoji?esc(s.emoji)+' ':''}${esc(s.name)}</span>
      <span class="vl num">${money(s.value)}<small>${pct}%${s.count?`・${s.count} 筆`:''}</small></span></button>`}).join('');
  return `<div class="pie"><svg viewBox="0 0 120 120" role="img" aria-label="支出比例圖"><g transform="rotate(-90 60 60)">${segs}</g>
    <text x="60" y="56" text-anchor="middle" font-size="9" fill="var(--muted)">${kind==='jar'?'總支出':'支出'}</text>
    <text x="60" y="71" text-anchor="middle" font-size="${money(total).length>8?10:13}" font-weight="600" fill="var(--ink)" font-family="Sora, sans-serif">${money(total)}</text></svg>
    <div class="legend">${legend}</div></div>${note?`<p class="pienote">${note}</p>`:''}
    ${kind==='jar'?'<p class="pienote">點罐子可以看它的分類比例</p>':''}`;
}
function listView(){

  if(isSJ(listBucket)&&!Cloud.jars[sjId(listBucket)])listBucket='all';
  const items=monthItems(listMonth,listBucket);
  if(listBucket==='all')listCat=null;
  const catOf=t=>t.jid?(t.kind==='expense'?(t.catKey||t.catName||'?'):null):(t.type==='expense'?(t.catId||'?'):null);
  const shown=listCat?items.filter(t=>catOf(t)===listCat):items;
  let html='',last='',sumOut=0,sumIn=0,shOut=0,shMine=0,toJar=0;
  for(const t of items){
    if(t.jid){
      if(t.kind==='expense'){shOut+=t.amount;shMine+=myShare(t)}
      else if(isSJ(listBucket)){if(jarIn(t))sumIn+=t.amount}

    }

      if(t.type==='expense')sumOut+=t.amount;

    if(t.date!==last){if(last)html+='</ul>';const d=new Date(t.date+'T00:00');html+=`<div class="day">${d.getMonth()+1}月${d.getDate()}日 週${'日一二三四五六'[d.getDay()]}</div><ul class="txs">`;last=t.date}

    <div class="total"><span>這個月</span><span class="num" style="text-align:right">${isSJ(listBucket)
      ?`共用支出 <b>${money(shOut)}</b>（你的份額 ${money(shMine)}）<br>撥入 <b>${money(sumIn)}</b>`
      :`個人支出 <b>${money(sumOut)}</b>　收入 <b>${money(sumIn)}</b>${toJar?`<br>撥到共用罐 ${money(toJar)}`:''}${shOut?`<br>共用支出 ${money(shOut)}（你的份額 <b>${money(shMine)}</b>）`:''}`}</span></div>
    ${pieHtml()}
    ${listCat?`<button class="catfilter" data-action="pie" data-key="${esc(listCat)}">只看：${esc(catLabel)}　✕</button>`:''}
    ${html||'<div class="empty">這個月還沒有紀錄。</div>'}`;

// a category key is a personal category id, or 'jc:<jarId>:<catId>' for a shared jar's own category
function resolveCat(key){
  if(!key)return null;
  if(key.startsWith('jc:')){const [,jid,cid]=key.split(':');const j=Cloud.jars[jid];const c=j&&(j.categories||[]).find(x=>x.id===cid);
    return c?{key,emoji:c.emoji,name:c.name,shared:true,jid}:null}
  const c=catById(key);if(!c)return null;
  if(isSJ(c.bucketId))return Cloud.jars[sjId(c.bucketId)]?{key,emoji:c.emoji,name:c.name,shared:true,jid:sjId(c.bucketId)}:null;
  return {key,emoji:c.emoji,name:c.name,shared:false,bucketId:c.bucketId};
}

function updateHint(){
  const d=draft;if(!d)return;const h=document.getElementById('hint');const btn=document.getElementById('saveBtn');
  const amt=Math.round(+d.amount||0),mk=(d.date||today()).slice(0,7);let ok=amt>0,msg='';
  const exShared=d.editShared?d.editShared.id:undefined;
  if(d.type==='expense'){
    const c=resolveCat(d.catId);ok=ok&&!!c;
    if(c){const id=c.shared?SJ+c.jid:c.bucketId;const after=(c.shared?jarStats(c.jid,mk,exShared).bal:balanceOf(id,mk,d.editId))-amt;
      msg=`從「<b>${esc(nameOf(id))}</b>」扣除，扣完剩 <span class="${after<0?'neg':''}">${money(after)}</span>${after<0?'（會超支）':''}`}
    else msg='選一個分類';
  }else if(d.type==='income'){
    if(amt>0){
      let a;
      if(d.mode==='one')a=allocate(amt,'one',d.target);
      else{
        const T0=planTotals(d.editId)[mk]||0,a0=planAlloc(T0,mk),a1=planAlloc(T0+amt,mk);
        a={};for(const k in a1)a[k]=a1[k]-(a0[k]||0);
        if(S.allocMode==='amount'){
          const P=planSum(mk),T=T0+amt;
          const tail=P<=0?'還沒設定每月計畫金額，會全部放入「'+esc(remainderBucket().name)+'」':T>=P?(T>P?`本月收入 ${money(T)}，超過計畫 ${money(T-P)}，多的放入「${esc(remainderBucket().name)}」`:`本月收入剛好達到計畫 ${money(P)}`):`本月收入 ${money(T)}，還差 ${money(P-T)} 達到計畫，先依比例分配`;
          msg='<br>'+tail;
        }
      }
      msg=Object.entries(a).filter(([,v])=>v).map(([k,v])=>`${esc(nameOf(k))} <b>${v<0?'−':'+'}${money(Math.abs(v))}</b>`).join('　')+msg;
    }
    else msg='輸入金額後會顯示分配結果';
  }else{
    const both=isSJ(d.from)&&isSJ(d.to);
    ok=ok&&d.from!==d.to&&!both;
    msg=d.from===d.to?'請選兩個不同的罐子':both?'共用罐之間不能直接轉移，請經過自己的罐子':`「${esc(nameOf(d.from))}」目前有 ${money(balanceOf(d.from,mk,d.editId))}`;
  }
  h.innerHTML=msg;btn.disabled=!ok;
}
function jarTxnRef(jid,id){return Cloud.fs.collection('jars').doc(jid).collection('txns').doc(id)}
function saveDraft(){
  const d=draft;const amt=Math.round(+d.amount||0);if(amt<=0)return;
  const oldP=d.editId?S.txns.find(t=>t.id===d.editId):null,oldS=d.editShared||null;
  const date=d.date||today(),note=(d.note||'').trim();
  const c=d.type==='expense'?resolveCat(d.catId):null;
  if(d.type==='expense'&&!c)return;
  if(c&&c.shared){ // goes into the shared jar
    if(!cloudOn()){toast('需要登入才能記到共用罐');return}
    const id=(oldS&&oldS.jid===c.jid)?oldS.id:uid();
    const keepSplit=oldS&&oldS.jid===c.jid&&oldS.split;
    const doc={kind:'expense',amount:amt,date,note,by:myUid(),byName:myName(),emoji:c.emoji,catName:c.name,catKey:c.key,split:keepSplit||((Cloud.jars[c.jid]||{}).members||[]).length||1,ts:(oldS&&oldS.ts)||Date.now()};
    jarTxnRef(c.jid,id).set(doc).catch(e=>toast('共用罐儲存失敗：'+(e.code||'')));
    if(oldS&&oldS.jid!==c.jid)jarTxnRef(oldS.jid,oldS.id).delete().catch(()=>{});
    if(oldP)removeTxn(oldP.id);
  }else{
    const base={id:oldP?oldP.id:uid(),ts:oldP?oldP.ts:Date.now(),type:d.type,amount:amt,date,note};
    if(d.type==='expense'){base.catId=c.key;base.bucketId=c.bucketId}
    else if(d.type==='income'){base.mode=d.mode;if(d.mode==='one')base.target=d.target}
    else{if(d.from===d.to||(isSJ(d.from)&&isSJ(d.to)))return;base.from=d.from;base.to=d.to}
    if((isSJ(base.target)||isSJ(base.from)||isSJ(base.to))&&!cloudOn()){toast('需要登入才能使用共用罐');return}
    putTxn(base);
    if(oldS)jarTxnRef(oldS.jid,oldS.id).delete().catch(()=>{});
  }
  closeSheet();render();toast(oldP||oldS?'已儲存變更':'已記下');
}
function openTx(id){
  const t=S.txns.find(x=>x.id===id);if(!t)return;
  const b0=S.buckets[0]?.id,b1=S.buckets[1]?.id||b0;
  draft={editId:t.id,type:t.type,amount:String(t.amount),date:t.date,note:t.note||'',
    catId:t.type==='expense'&&resolveCat(t.catId)?t.catId:null,
    mode:t.type==='income'?(t.mode||'pct'):'pct',target:(t.type==='income'&&t.target)||b0,
    from:t.from||b0,to:t.to||b1};
  openSheet(addHtml());
}
function openShared(jid,id){
  const t=(Cloud.jarTxns[jid]||[]).find(x=>x.id===id);if(!t)return;
  const me=myUid();
  if(t.by===me&&id.startsWith('m_')&&S.txns.find(x=>x.id===id.slice(2))){openTx(id.slice(2));return}
  if(t.by===me&&t.kind==='expense'){
    draft={editShared:{jid,id,ts:t.ts,split:t.split},type:'expense',amount:String(t.amount),date:t.date,note:t.note||'',catId:resolveCat(t.catKey)?t.catKey:null,mode:'pct'};
    openSheet(addHtml());return;
  }
  const why=t.by!==me?`這筆是 ${esc(t.byName||'成員')} 記的，只有記錄的人可以修改。`:t.kind==='contrib'?'這是你每月從自己的罐子撥進共用罐的金額。要調整的話，到設定頁修改這個共用罐的「每月撥款」。':'這筆由你的帳本自動產生。';
  openSheet(`<ul class="txs">${sharedRow(t,true)}</ul><p class="note">${t.date}</p><p class="note">${why}</p>
    <button class="ghost" style="width:100%;margin-top:10px" data-action="close">關閉</button>`);
}

let tt=null,undoFn=null;
function toast(m,undo){
  const el=document.getElementById('toast');undoFn=undo||null;
  el.innerHTML=esc(m)+(undo?'<button class="undo" data-action="undo">復原</button>':'');
  el.classList.toggle('act',!!undo);el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>{el.classList.remove('show','act');undoFn=null},undo?4500:1600);
}

/* swipe left on a record to delete it */
const DELW=84;let sw=null,openLi=null,suppressClick=false;
function setX(li,x,anim){const b=li.querySelector('.tx');b.style.transition=anim?'':'none';b.style.transform=x?`translateX(${x}px)`:''}
function closeSwipe(){if(openLi){setX(openLi,0,true);openLi=null}}
document.addEventListener('pointerdown',e=>{
  const li=e.target.closest('li.swipe');
  if(openLi&&li!==openLi){closeSwipe();suppressClick=true;setTimeout(()=>suppressClick=false,400)}
  if(!li||e.target.closest('.del-act'))return;
  sw={li,x0:e.clientX,y0:e.clientY,dx:0,dir:null,base:li===openLi?-DELW:0};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!sw)return;
  const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.dir){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;sw.dir=Math.abs(dx)>Math.abs(dy)?'h':'v'}
  if(sw.dir!=='h')return;
  sw.dx=dx;setX(sw.li,Math.min(0,Math.max(-DELW*1.4,sw.base+dx)),false);
},{passive:true});
function endSwipe(){
  if(!sw)return;
  if(sw.dir==='h'){
    const x=sw.base+sw.dx;
    if(x<-DELW/2){setX(sw.li,-DELW,true);openLi=sw.li}else{setX(sw.li,0,true);if(openLi===sw.li)openLi=null}
    suppressClick=true;setTimeout(()=>suppressClick=false,400);
  }
  sw=null;
}
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',()=>{if(sw&&sw.dir==='h'){setX(sw.li,sw.base,true)}sw=null});
document.addEventListener('click',e=>{if(suppressClick&&!e.target.closest('.del-act')){e.preventDefault();e.stopPropagation();suppressClick=false}},true);

function swipeDelete(ref){
  openLi=null;
  if(ref.startsWith('p:')){
    const id=ref.slice(2),t=S.txns.find(x=>x.id===id);if(!t)return;
    const copy=JSON.parse(JSON.stringify(t));
    removeTxn(id);render();
    toast('已刪除',()=>{putTxn(copy);render();toast('已復原')});
  }else{
    const [,jid,id]=ref.split(':');const t=(Cloud.jarTxns[jid]||[]).find(x=>x.id===id);if(!t||!cloudOn())return;
    const {id:_i,jid:_j,...data}=t;
    jarTxnRef(jid,id).delete().catch(()=>toast('刪除失敗'));
    Cloud.jarTxns[jid]=Cloud.jarTxns[jid].filter(x=>x.id!==id);render();
    toast('已刪除',()=>{jarTxnRef(jid,id).set(data).then(()=>toast('已復原')).catch(()=>toast('復原失敗'))});
  }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  switch(a){
    case 'open-add':openAdd('expense');break;
    case 'close':closeSheet();break;
    case 'type':draft.type=el.dataset.t;document.getElementById('sheetBody').innerHTML='<div class="grab"></div>'+addHtml();updateHint();break;
    case 'cat':draft.catId=id;document.querySelectorAll('.cat').forEach(c=>c.setAttribute('aria-pressed',c.dataset.id===id));updateHint();break;
    case 'save':saveDraft();break;
    case 'tx':openTx(id);break;
    case 'stx':openShared(el.dataset.jid,id);break;
    case 'swdel':swipeDelete(el.dataset.ref);break;
    case 'undo':{const f=undoFn;undoFn=null;document.getElementById('toast').classList.remove('show','act');if(f)f();break}
    case 'delstx':if(!confirm('確定刪除這筆紀錄？'))break;jarTxnRef(el.dataset.jid,id).delete().catch(()=>toast('刪除失敗'));closeSheet();render();toast('已刪除');break;
    case 'newjar':createJar();break;
    case 'invite':inviteTo(el.dataset.jid);break;
    case 'uninvite':cancelInvite(id);break;
    case 'accept':acceptInvite(id);break;
    case 'decline':declineInvite(id);break;
    case 'leavejar':leaveJar(el.dataset.jid);break;
    case 'deljar':deleteJar(el.dataset.jid);break;
    case 'rmmember':removeMember(el.dataset.jid,id);break;
    case 'verify':sendVerify();break;
    case 'verified':checkVerified();break;
    case 'jcolor':{const j=Cloud.jars[el.dataset.jid];if(!j)break;j.color=PALETTE[(PALETTE.indexOf(j.color)+1)%PALETTE.length];saveJarMeta(el.dataset.jid,['color']);render();break}
    case 'jaddc':{const j=Cloud.jars[el.dataset.jid];if(!j)break;j.categories=(j.categories||[]).concat([{id:uid(),emoji:'🏷️',name:'新分類'}]);saveJarMeta(el.dataset.jid,['categories']);render();break}
    case 'jdelc':{const j=Cloud.jars[el.dataset.jid];if(!j)break;j.categories=(j.categories||[]).filter(c=>c.id!==id);saveJarMeta(el.dataset.jid,['categories']);render();break}
    case 'deltx':if(!confirm('確定刪除這筆紀錄？'))break;removeTxn(id);closeSheet();render();toast('已刪除');break;
    case 'mshift':listMonth=shiftMonth(listMonth,+el.dataset.d);listCat=null;render();break;
    case 'tolist':listBucket='all';tab='list';render();window.scrollTo(0,0);break;
    case 'pie':{const k=el.dataset.key;if(listBucket==='all'){listBucket=k;listCat=null}else listCat=listCat===k?null:k;render();break}
    case 'jump':listBucket=el.dataset.bucket;listCat=null;tab='list';render();window.scrollTo(0,0);break;
    case 'lb':listBucket=el.dataset.b;listCat=null;render();break;
    case 'color':{const b=bucketById(id);b.color=PALETTE[(PALETTE.indexOf(b.color)+1)%PALETTE.length];persist();render();break}
    case 'allocmode':setAllocMode(el.dataset.m);break;
    case 'addb':S.buckets.push({id:'b_'+uid(),name:'新罐子',pct:0,amt:0,color:PALETTE[S.buckets.length%PALETTE.length]});persist();render();break;
    case 'delb':{
      const used=S.txns.some(t=>t.bucketId===id||(t.type==='income'&&t.mode==='one'&&t.target===id)||t.from===id||t.to===id)||S.categories.some(c=>c.bucketId===id)||Object.values(S.jarPlan||{}).some(jp=>(jp.hist||[]).some(x=>x.src===id&&+x.amt>0));
      if(S.buckets.length<=1){toast('至少要保留一個罐子');break}
      if(used){toast('這個罐子有紀錄或分類在用，先把分類改到別的罐子');break}
      S.buckets=S.buckets.filter(b=>b.id!==id);if(S.remainderId===id)S.remainderId=S.buckets[S.buckets.length-1].id;persist();render();break}
    case 'addc':S.categories.push({id:uid(),emoji:'🏷️',name:'新分類',bucketId:S.buckets[0].id});persist();render();break;
    case 'delc':S.categories=S.categories.filter(c=>c.id!==id);persist();render();break;
    case 'export':exportData();break;
    case 'csv':exportCSV();break;
    case 'import':document.getElementById('importFile').click();break;
    case 'reset':if(confirm(cloudOn()?'確定清除所有紀錄與設定？雲端帳本也會一起清空，無法復原。':'確定清除所有紀錄與設定？這個動作無法復原。')){replaceAll(defaults());toast('已清除')}break;
    case 'auth':authDo(el.dataset.k);break;
    case 'signout':signOutCloud();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(draft){
    if(t.id==='amt'){t.value=t.value.replace(/[^0-9]/g,'');draft.amount=t.value;updateHint();return}
    if(t.id==='note'){draft.note=t.value;return}
  }
  const ed=t.dataset.edit;if(!ed||ed==='bcarry')return;
  if(ed==='jname'||ed==='jcemoji'||ed==='jcname'){
    const j=Cloud.jars[t.dataset.jid];if(!j)return;
    if(ed==='jname'){j.name=t.value;saveJarMeta(t.dataset.jid,['name'])}
    else{const c=(j.categories||[]).find(x=>x.id===t.dataset.id);if(!c)return;c[ed==='jcemoji'?'emoji':'name']=t.value;saveJarMeta(t.dataset.jid,['categories'])}
    return;
  }
  if(ed==='jamt'){setJarPlan(t.dataset.jid,'amt',Math.max(0,parseInt(t.value)||0));persist();return}
  if(ed==='bname')bucketById(t.dataset.id).name=t.value;
  if(ed==='bpct'){bucketById(t.dataset.id).pct=Math.max(0,Math.min(100,parseInt(t.value)||0));const sum=targets().reduce((a,b)=>a+b.pct,0);const ps=document.querySelector('.pctsum');if(ps){ps.textContent='合計 '+sum+'%'+(sum===100?'':'，建議調整到 100%（目前會依比例換算）');ps.classList.toggle('bad',sum!==100)}}
  if(ed==='bamt'){bucketById(t.dataset.id).amt=Math.max(0,parseInt(t.value)||0);const ps=document.querySelector('#plansum b');if(ps)ps.textContent=money(planSum())}
  if(ed==='cemoji')catById(t.dataset.id).emoji=t.value;
  if(ed==='cname')catById(t.dataset.id).name=t.value;
  persist();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='importFile'&&t.files[0]){importData(t.files[0]);t.value='';return}
  if(t.id==='lm'||t.id==='hm'){listMonth=t.value||curMonth();listCat=null;render();return}
  if(t.dataset.edit==='bcarry'){bucketById(t.dataset.id).carry=t.checked;persist();render();return}
  if(draft){
    if(t.id==='date'){draft.date=t.value;updateHint();return}
    if(t.id==='mode'){draft.mode=t.value;document.getElementById('tgtWrap').classList.toggle('hidden',t.value!=='one');updateHint();return}
    if(t.id==='tgt'){draft.target=t.value;updateHint();return}
    if(t.id==='from'){draft.from=t.value;updateHint();return}
    if(t.id==='to'){draft.to=t.value;updateHint();return}
  }
  if(t.dataset.edit==='cbucket'){catById(t.dataset.id).bucketId=t.value;persist();render()}
  if(t.dataset.edit==='remainder'){S.remainderId=t.value;const b=bucketById(t.value);if(b&&b.carry===false){b.carry=true;toast(`「${b.name}」是指定罐子，已改為結轉`)}persist();render();return}
  if(t.dataset.edit==='jsrc'){setJarPlan(t.dataset.jid,'src',t.value);persist();render();return}
  if(['bname','bpct','bamt','jamt','jname'].includes(t.dataset.edit))render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em')){authDo('login');return}if(e.key==='Enter'&&draft&&e.target.tagName==='INPUT'){const b=document.getElementById('saveBtn');if(b&&!b.disabled)saveDraft()}});
const obs=new MutationObserver(()=>{if(draft&&document.getElementById('hint')&&!document.getElementById('hint').dataset.init){document.getElementById('hint').dataset.init=1;updateHint()}});
obs.observe(document.getElementById('sheetBody'),{childList:true});

init();
</script>
