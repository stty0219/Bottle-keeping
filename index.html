<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E8EDF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>分罐記帳</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="分罐記帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF1;--surface:#F7F9FB;--ink:#16202B;--muted:#5F6E7C;--line:#CFD8E0;--neg:#C2412D;--chip:#DDE4EA;
  --num:"Sora","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10161C;--surface:#1A222A;--ink:#E6ECF1;--muted:#8D9BA8;--line:#2A3540;--neg:#F07A62;--chip:#243039}
}
:root[data-theme="dark"]{--bg:#10161C;--surface:#1A222A;--ink:#E6ECF1;--muted:#8D9BA8;--line:#2A3540;--neg:#F07A62;--chip:#243039}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;min-height:100%}
button,input,select{font:inherit;color:inherit}
/* iPhone zooms in on any field smaller than 16px when it gets focus */
input,select,textarea{font-size:16px}
/* no double-tap zoom */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.ttl{display:flex;align-items:center;gap:6px}
.bell{position:relative;width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--ink);display:grid;place-items:center;padding:0}
.bell svg{width:22px;height:22px}
.bell .dot{position:absolute;top:6px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--neg);border:2px solid var(--bg);display:none}
.bell.has .dot{display:block}
.ntop{display:flex;justify-content:space-between;align-items:center;margin:-2px 0 6px}
.ntop b{font-size:18px}
.nclr{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:15px}
.upd{display:grid;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;margin-top:8px}
.upd button{background:var(--bg);color:var(--ink);border:0;border-radius:10px;padding:11px;font-weight:700}
.rel{margin-top:14px}
.rel .rh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.rel .rh b{font-size:16px;color:var(--ink)}
.rel ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.rel li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.5}
.ntag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-top:2px}
.ntag.new{background:#D7EFE2;color:#1E5B3A}.ntag.imp{background:#DCE7F7;color:#244C86}.ntag.fix{background:#FBE3D5;color:#8A3A14}
.nempty{padding:26px 0;text-align:center;color:var(--muted);font-size:14px}
header.top h1{font-size:22px;margin:0;font-weight:700}
.sync{font-size:12px;color:var(--muted)}

/* jars */
.shelf{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px;scroll-snap-type:x mandatory}
.jarcol{display:block;flex:1 0 96px;min-width:96px;scroll-snap-align:start;text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none}
.jar{position:relative;height:168px;margin:0 8px;border:2.5px solid var(--ink);border-radius:16px 16px 30px 30px;overflow:hidden;background:var(--surface)}
.jar::before{content:"";position:absolute;left:14%;right:14%;top:-2px;height:10px;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 8px 8px;background:var(--bg);z-index:2}
.jar.neg{border-color:var(--neg)}
.fill{position:absolute;left:0;right:0;bottom:0;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.fill::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:rgba(255,255,255,.28)}
.jarpct{position:absolute;inset:auto 0 10px 0;font-size:13px;font-weight:600;z-index:3;color:var(--ink);mix-blend-mode:normal}
.jarname{margin-top:10px;font-weight:700;font-size:15px}
.jarbal{font-size:19px;font-weight:600}
.jarbal.neg{color:var(--neg)}
.jarsub{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

.total{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 6px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.total span:first-child{color:var(--muted);font-size:14px}
.total b{font-size:20px}

h2{font-size:15px;margin:26px 0 10px;font-weight:700}
.month-row{display:grid;gap:12px}
.mrow .lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

/* list */
.txs{list-style:none;margin:0;padding:0}
.day{font-size:13px;color:var(--muted);margin:18px 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tx.sys{cursor:default}
.ver{cursor:default;-webkit-user-select:none;user-select:none}
.devlink{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:28px;padding:13px 14px;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface);font-weight:600}
.dev .sum-top{justify-content:space-between;align-items:center;gap:10px}
.dev .back{background:none;border:0;font-size:15px;padding:8px 0;color:var(--ink)}
.dev h1{font-size:20px;margin:6px 0 14px}
.devitem{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 14px;margin-bottom:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.devitem .t{font-weight:600}
.devitem .s{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rule .tx2{font-size:14px}
.rule .tx2 small{display:block;font-size:12px;color:var(--muted)}
.unitw{display:flex;align-items:center;gap:6px}
.unitw input{width:76px;text-align:right}
.unitw .u{color:var(--muted);font-size:13px;min-width:1.4em}
.gd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--num);font-weight:700;font-size:15px;flex:none}
.gd.g-S{background:#D4A017}.gd.g-A{background:#2F7D4F}.gd.g-B{background:#3D6FB6}.gd.g-C{background:#C2412D}
.cgrp{margin-top:18px}
.cgrp .hd{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.cgrp .hd .gd{width:24px;height:24px;font-size:13px}
.crow{display:grid;grid-template-columns:1fr 36px;gap:6px;align-items:center;margin-bottom:6px}
.trow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-bottom:8px}
.thcard{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px;margin-bottom:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.thcard.on{border-color:var(--ink)}
.thcard .nm{font-weight:600}
.thcard .ds{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.thcard .ck{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.tp{width:76px;height:76px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:var(--s-bg,var(--bg));color:var(--s-fg,var(--ink));border:1px solid var(--line)}
.tp .tpz{transform:scale(.46);transform-origin:center}
.tp *{animation:none!important}
.tpbig{height:180px;border-radius:16px;display:grid;place-items:center;margin:4px 0 14px;background:var(--s-bg,var(--bg));color:var(--s-fg,var(--ink));border:1px solid var(--line);overflow:hidden}
.tpbig *{animation:none!important}

/* month summary (月結算) — shared layout; each theme sets the --s-* colors */
.g-S{--gc:#D4A017}.g-A{--gc:#2F7D4F}.g-B{--gc:#3D6FB6}.g-C{--gc:#C2412D}
.sumbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:10px 0 0;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.sum{position:fixed;inset:0;z-index:25;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--s-bg,var(--bg));color:var(--s-fg,var(--ink))}
.sum-in{position:relative;max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px))}
.sum-top{display:flex;justify-content:flex-end;position:sticky;top:0;z-index:4;padding-top:4px}
.sum-x{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--s-line,var(--line));background:var(--s-card,var(--surface));color:var(--s-fg,var(--ink));font-size:16px}
.sum .note,.sum .k,.sum .s,.sum .ds,.sum .sum-prev,.sum .kick{color:var(--s-muted,var(--muted))}
.sum-head{text-align:center;padding:4px 0 8px}
.kick{font-size:12px;letter-spacing:.12em}
.sum-title{font-size:21px;font-weight:700}
.badgew{display:flex;justify-content:center;margin:18px 0 10px}
.gtitle{font-size:15px;font-weight:700;color:var(--gc)}
.sum-comment{font-size:16px;font-weight:600;margin-top:6px}
.sum-prev{font-size:13px;margin-top:6px}
.sum section{display:block;margin-top:26px}
.sum h3{font-size:15px;margin:0 0 10px}
.hero{font-family:var(--num);font-size:34px;font-weight:700;color:var(--s-good,#2F7D4F);line-height:1.15}
.hero.neg{color:var(--s-bad,var(--neg))}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.scard{background:var(--s-card,var(--surface));border:1.5px solid var(--s-line,var(--line));border-radius:14px;padding:12px 10px;min-width:0}
.scard .k{font-size:12px}
.scard .v{font-size:18px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .d{font-size:11.5px;margin-top:4px;line-height:1.35}
.sum .bad{color:var(--s-bad,var(--neg))}
.sum .good{color:var(--s-good,#2F7D4F)}
.sum .flat{color:var(--s-muted,var(--muted))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sum{--s-good:#6FCB93}}
.rank{border-bottom:1px solid var(--s-line,var(--line))}
.rankh{display:grid;grid-template-columns:26px minmax(0,1fr) auto 14px;gap:4px 10px;align-items:center;padding:9px 0;width:100%;background:none;border:0;color:inherit;text-align:left}
.rankh .no{font-family:var(--num);font-weight:700;color:var(--s-muted,var(--muted));font-size:13px;text-align:center}
.rankh .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankh .nm small{color:var(--s-muted,var(--muted));font-size:11px;margin-left:4px}
.rankh .am{font-size:14px;font-weight:600;text-align:right}
.rankh .am small{display:block;font-size:11px;color:var(--s-muted,var(--muted));font-weight:400}
.rankh .cv{color:var(--s-muted,var(--muted));transition:transform .2s;font-size:13px}
.rank.open .rankh .cv{transform:rotate(90deg)}
.rankh .bar{grid-column:2/4;height:6px;background:var(--s-line,var(--chip))}
.cdet{padding:0 0 10px 36px}
.cdh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--s-muted,var(--muted));margin-bottom:2px}
.sortb{position:relative;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;border:1px solid var(--s-line,var(--line));font-size:12px;color:var(--s-fg,var(--ink))}
.sortb select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px;cursor:pointer}
.sortb svg{width:14px;height:14px}
.cd{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px dashed var(--s-line,var(--line));font-size:13px}
.cd .dt{color:var(--s-muted,var(--muted));font-family:var(--num);font-size:12px}
.cd .nt{min-width:0;overflow-wrap:anywhere}
.cd .nt small{display:block;font-size:11px;color:var(--s-muted,var(--muted))}
.cd .am{font-weight:600}
.cdmore{display:block;width:100%;margin-top:4px;padding:8px;border:0;background:none;color:var(--s-muted,var(--muted));font-size:13px}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--s-line,var(--line))}
.jrow .nm{font-weight:600;font-size:14px}
.jrow .st{font-size:13px;font-weight:600;text-align:right}
.jrow .ds{font-size:12px}
.hl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hl .scard .v{font-size:16px}
.hl .scard .s{font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.confetti{position:absolute;left:0;right:0;top:0;height:100vh;pointer-events:none;overflow:hidden;z-index:3}
.confetti i{position:absolute;top:-16px;width:7px;height:12px;border-radius:2px;animation:fall 2.8s ease-in both}

/* shared entrance */
.sum .anim{animation:sumIn .5s ease both;animation-delay:calc(var(--i,0) * 200ms)}
@keyframes sumIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(105vh) rotate(600deg);opacity:.3}}
:root[data-motion="reduce"] .sum *,:root[data-motion="off"] .sum *,.sum.still *{animation:none!important}
:root[data-motion="reduce"] .sum .confetti,:root[data-motion="off"] .sum .confetti,.sum.still .confetti{display:none}

/* 1. 經典 */
.th-classic .bz{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-size:64px;font-weight:700;color:#fff;box-shadow:0 10px 28px rgba(10,20,30,.22)}
.th-classic .bz.g-S{background:radial-gradient(circle at 30% 25%,#F6D365,#D4A017 60%,#A87C0B)}
.th-classic .bz.g-A{background:radial-gradient(circle at 30% 25%,#7FD3A0,#2F7D4F 65%)}
.th-classic .bz.g-B{background:radial-gradient(circle at 30% 25%,#8DB4E8,#3D6FB6 65%)}
.th-classic .bz.g-C{background:radial-gradient(circle at 30% 25%,#F0A08E,#C2412D 65%)}
.sum.th-classic .bz{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both .25s}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}

/* 2. 手帳 */
.th-journal{--s-bg:#F5EFE3;--s-fg:#3B3128;--s-muted:#8A7B6A;--s-card:#FBF7EF;--s-line:#E2D7C4;--s-good:#4E7A3A;--s-bad:#B03A2E;font-family:"Noto Serif TC","Songti TC",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .th-journal{--s-bg:#25211C;--s-fg:#EDE4D6;--s-muted:#A8998A;--s-card:#2E2923;--s-line:#433B32;--s-good:#9CC27E;--s-bad:#E58A7A}}
.th-journal .scard{border-style:dashed}
.th-journal .bz{transform:rotate(-10deg);border:4px solid var(--gc);border-radius:14px;padding:5px;color:var(--gc)}
.th-journal .bz .in{border:1.5px solid var(--gc);border-radius:9px;padding:6px 20px;text-align:center}
.th-journal .bz b{display:block;font-size:56px;line-height:1;font-family:var(--num)}
.th-journal .bz span{display:block;font-size:12px;letter-spacing:.25em;margin-top:6px}
.sum.th-journal .bz{animation:stamp .55s cubic-bezier(.3,1.3,.5,1) both .3s}
@keyframes stamp{0%{opacity:0;transform:scale(2.2) rotate(-10deg)}60%{opacity:1;transform:scale(.92) rotate(-10deg)}100%{transform:scale(1) rotate(-10deg)}}

/* 3. 頒獎典禮 */
.th-award{--s-bg:#2A1B07;--s-fg:#FAEEDA;--s-muted:#C9A86A;--s-card:#3A2710;--s-line:#5C4219;--s-good:#E7C55B;--s-bad:#F09595;font-family:"Noto Serif TC","Songti TC",serif}
.th-award .sum-title{color:#FAC775}
.th-award .bz{display:flex;flex-direction:column;align-items:center}
.th-award .bz .disc{width:100px;height:100px;border-radius:50%;background:#FAEEDA;border:6px solid var(--gc);display:grid;place-items:center;font-family:var(--num);font-size:52px;font-weight:700;color:#4A3208}
.th-award .bz .rib{display:flex;gap:8px;margin-top:-8px}
.th-award .bz .rib i{display:block;width:18px;height:32px;background:#A32D2D;transform:skewX(12deg)}
.th-award .bz .rib i+i{transform:skewX(-12deg)}
.sum.th-award .bz{animation:drop .9s cubic-bezier(.3,1.2,.5,1) both .3s}
@keyframes drop{0%{opacity:0;transform:translateY(-160px)}60%{opacity:1;transform:translateY(10px)}80%{transform:translateY(-4px)}100%{transform:none}}

/* 4. 街機 */
.th-arcade{--s-bg:#1B1640;--s-fg:#E8E6FF;--s-muted:#9E98D8;--s-card:#252058;--s-line:#3A3380;--s-good:#7EE0B5;--s-bad:#FF8A8A}
.th-arcade,.th-arcade .num,.th-arcade .hero{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.th-arcade .sum-title{color:#FAC775;letter-spacing:.08em}
.th-arcade .scard{border-radius:4px}
.th-arcade .bz{text-align:center;color:#FAC775}
.th-arcade .bz .lt{font-size:12px;letter-spacing:.4em;color:#AFA9EC}
.th-arcade .bz .big{font-size:88px;font-weight:700;font-style:italic;line-height:1}
.th-arcade .bz .stars{font-size:24px;letter-spacing:4px}
.th-arcade .bz .stars i{font-style:normal;display:inline-block}
.th-arcade .bz .stars i.off{opacity:.25}
.sum.th-arcade .bz .big{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both .3s}
.sum.th-arcade .bz .stars i{animation:pop .35s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.7s + var(--n) * .18s)}

/* 5. 集卡 */
.th-card{--s-bg:#EEEAF8;--s-fg:#2A2342;--s-muted:#6E6690;--s-card:#F8F6FD;--s-line:#D8D1EE;--s-good:#3B7D57;--s-bad:#B5463A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .th-card{--s-bg:#1D1A2A;--s-fg:#ECE8FA;--s-muted:#A39CC4;--s-card:#272338;--s-line:#3A3452;--s-good:#7FD3A0;--s-bad:#F09595}}
.th-card .bz{width:104px;height:148px;border-radius:14px;border:4px solid var(--gc);background:var(--s-card);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(4deg)}
.th-card .bz .t{font-size:11px;color:var(--s-muted);letter-spacing:.1em}
.th-card .bz .big{font-family:var(--num);font-size:64px;font-weight:700;color:var(--gc);line-height:1.1}

<script>
// ===== App version: change only this line when releasing (sw.js picks it up automatically) =====
const APP_VERSION='v24';
// ===== What's new in this version (shown under the bell). Replace with the new release's notes each time. =====
// t: 'new' 新功能 / 'imp' 改善 / 'fix' 修正
const RELEASE={date:'2026-11-03',items:[
  {t:'new',s:'新增通知鈴鐺：每次更新後，可以在這裡看到新版本加了什麼、修了什麼。'},
  {t:'new',s:'App 從背景切回來時會自動檢查新版本，有新版本時，在通知裡點一下就能重新載入。'}
]};
const PALETTE=['#1F7A80','#D29A17','#8A4F7D','#3D6FB6','#5C8A3A','#C25B3A','#6B6F7A'];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('zh-TW');

function defaults(){
  const inv={id:'b_inv',name:'投資',pct:30,color:PALETTE[0]},day={id:'b_day',name:'日常',pct:50,color:PALETTE[1]},flex={id:'b_flex',name:'彈性',pct:20,color:PALETTE[2]};
  const c=(e,n,b)=>({id:uid(),emoji:e,name:n,bucketId:b.id});
  return {v:1,buckets:[inv,day,flex],categories:[
    c('🍱','餐飲',day),c('🚌','交通',day),c('🛒','日用品',day),c('🏠','居住',day),c('📱','電信',day),
    c('📈','股票/ETF',inv),c('🏦','儲蓄',inv),
    c('🎬','娛樂',flex),c('✈️','旅遊',flex),c('🛍️','購物',flex),c('🎁','禮物',flex)
  ],txns:[]};
}

let S=null;               // state
let tab='home';
let listMonth=today().slice(0,7), listBucket='all', listCat=null, listQuery='', listAllMonths=false;
let draft=null;
const LSK='fenguan-ledger-v1';

/* ---------- local storage ---------- */
function loadLocal(){try{const r=localStorage.getItem(LSK);return r?JSON.parse(r):null}catch(e){return null}}
function saveLocal(){planCache=null;horizonCache=null;try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function setSync(t){document.getElementById('sync').textContent=t}
const clean=o=>JSON.parse(JSON.stringify(o));

/* ---------- cloud (Firebase) ---------- */
const Cloud={ready:false,user:null,fs:null,auth:null,ref:null,unsubs:[],metaTimer:null,err:'',busy:false,
  ledgerLoaded:false,jars:{},jarTxns:{},jarLoaded:{},jarUnsubs:{},jarsUnsub:null,inviteUnsubs:[],invites:[],sent:[],jarTimers:{},jarsLoaded:false};
function cloudConfigured(){return !!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&window.firebase)}
function cloudOn(){return !!(Cloud.user&&Cloud.ref)}
function syncStatus(){
  if(!cloudConfigured()||!Cloud.user){setSync('僅存於此裝置');return}
  if(!Cloud.ref){setSync('連線中…');return}
  if(!navigator.onLine){setSync('離線中，連線後自動同步');return}
  setSync('同步中…');
  Cloud.fs.waitForPendingWrites().then(()=>{if(cloudOn())setSync(navigator.onLine?'已同步':'離線中，連線後自動同步')}).catch(()=>{});
}
window.addEventListener('online',syncStatus);window.addEventListener('offline',syncStatus);

function cloudInit(){
  if(!cloudConfigured())return;
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    Cloud.auth=firebase.auth();Cloud.fs=firebase.firestore();
    Cloud.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    Cloud.ready=true;
    Cloud.auth.onAuthStateChanged(u=>{
      Cloud.user=u||null;
      if(u)cloudConnect().catch(e=>{Cloud.err='雲端連線失敗：'+(e.message||e.code);renderIfSettings();syncStatus()});
      else{cloudStop();syncStatus();renderIfSettings()}
    });
  }catch(e){Cloud.err='Firebase 設定有誤：'+e.message}
}
function cloudStop(){
  Cloud.unsubs.forEach(f=>{try{f()}catch(e){}});Cloud.unsubs=[];Cloud.ref=null;Cloud.ledgerLoaded=false;
  stopJars();
}

async function writeTxns(ref,txns){
  for(let i=0;i<txns.length;i+=400){
    const b=Cloud.fs.batch();
    txns.slice(i,i+400).forEach(t=>{const {id,...rest}=t;b.set(ref.collection('txns').doc(id),clean(rest))});
    await b.commit();
  }
}
async function deleteAllTxns(ref){
  const qs=await ref.collection('txns').get();
  for(let i=0;i<qs.docs.length;i+=400){const b=Cloud.fs.batch();qs.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
}

async function cloudConnect(){
  const u=Cloud.user;Cloud.err='';syncStatus();
  const col=Cloud.fs.collection('ledgers');
  let lid=null;
  if(S.ledgerId&&S.ledgerOwner===u.uid){lid=S.ledgerId}
  else{
    const q=await col.where('members','array-contains',u.uid).get();
    if(q.empty){
      const ref=col.doc();
      await ref.set({name:'我的帳本',owner:u.uid,members:[u.uid],buckets:clean(S.buckets),categories:clean(S.categories),allocMode:S.allocMode||'pct',remainderId:S.remainderId||null,jarPlan:clean(S.jarPlan||{}),gradeRules:S.gradeRules||null,sumTheme:S.sumTheme||null,themeText:S.themeText?clean(S.themeText):null,
        createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      await writeTxns(ref,S.txns);
      lid=ref.id;toast('已把這台裝置的資料上傳到雲端');
    }else{
      lid=q.docs[0].id;
      if(S.txns.length>0&&S.ledgerId!==lid){
        const ok=confirm(`這個帳號在雲端已經有帳本了。\n\n要改用雲端帳本嗎？這台裝置上的 ${S.txns.length} 筆紀錄會先下載成備份檔。\n\n按「取消」會登出，保留這台裝置的資料。`);
        if(!ok){await Cloud.auth.signOut();return}
        exportData();
      }
    }
  }
  S.ledgerId=lid;S.ledgerOwner=u.uid;saveLocal();
  subscribe(col.doc(lid));
}

function subscribe(ref){
  cloudStop();Cloud.ref=ref;
  const fail=e=>{ // ledger gone or no access: forget it and look again
    cloudStop();
    if(e&&e.code==='permission-denied'){S.ledgerId=null;saveLocal();cloudConnect().catch(()=>{})}
    else{Cloud.err='同步中斷：'+(e.message||e.code);renderIfSettings();syncStatus()}
  };
  Cloud.unsubs.push(ref.onSnapshot(snap=>{
    if(!snap.exists){fail({code:'permission-denied'});return}
    if(snap.metadata.hasPendingWrites)return;
    const d=snap.data();
    S.buckets=d.buckets||[];S.categories=d.categories||[];S.allocMode=d.allocMode||'pct';S.remainderId=d.remainderId||null;S.jarPlan=d.jarPlan||{};S.gradeRules=d.gradeRules||null;S.gradeComments=d.gradeComments||null;S.sumTheme=d.sumTheme||null;S.themeText=d.themeText||null;S.ledgerName=d.name||'我的帳本';
    const mig=migrateJarPlan()|migrateTheme();saveLocal();safeRender();if(mig)persist();
    if(!Cloud.ledgerLoaded){Cloud.ledgerLoaded=true;startJars()}
    scheduleMirror();
  },fail));
  Cloud.unsubs.push(ref.collection('txns').onSnapshot(qs=>{
    S.txns=qs.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
    saveLocal();safeRender();syncStatus();scheduleMirror();
  },fail));
  renderIfSettings();syncStatus();
}

/* re-render without stealing focus from a field being edited */
let renderQueued=false;
function safeRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#view')&&/INPUT|SELECT/.test(a.tagName)){renderQueued=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(renderQueued){setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('#view')&&/INPUT|SELECT/.test(a.tagName))){renderQueued=false;render()}},0)}});
function renderIfSettings(){if(tab==='settings')safeRender()}

/* ---------- write paths ---------- */
function persist(){ // buckets & categories
  saveLocal();
  if(!cloudOn())return;
  clearTimeout(Cloud.metaTimer);
  Cloud.metaTimer=setTimeout(()=>{
    Cloud.ref.update({buckets:clean(S.buckets),categories:clean(S.categories),allocMode:S.allocMode||'pct',remainderId:S.remainderId||null,jarPlan:clean(S.jarPlan||{}),gradeRules:S.gradeRules?clean(S.gradeRules):null,sumTheme:S.sumTheme||null,themeText:S.themeText?clean(S.themeText):null,gradeComments:null,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
      .catch(e=>{Cloud.err='設定沒有存到雲端：'+(e.message||e.code);renderIfSettings()});
    syncStatus();scheduleMirror();
  },600);
}
function putTxn(t){
  const i=S.txns.findIndex(x=>x.id===t.id);if(i>=0)S.txns[i]=t;else S.txns.push(t);
  saveLocal();
  if(cloudOn()){const {id,...rest}=t;Cloud.ref.collection('txns').doc(id).set(clean(rest)).catch(e=>toast('雲端儲存失敗：'+(e.code||'')));syncStatus();scheduleMirror()}
}
function removeTxn(id){
  S.txns=S.txns.filter(t=>t.id!==id);saveLocal();
  if(cloudOn()){Cloud.ref.collection('txns').doc(id).delete().catch(()=>{});syncStatus();scheduleMirror()}
}
async function replaceAll(data){ // import / reset
  const keep={ledgerId:S.ledgerId,ledgerOwner:S.ledgerOwner,ledgerName:S.ledgerName};
  S=Object.assign(data,keep);migrate();saveLocal();render();
  if(cloudOn()){
    setSync('同步中…');
    try{await deleteAllTxns(Cloud.ref);await writeTxns(Cloud.ref,S.txns);persist()}
    catch(e){toast('雲端更新失敗：'+(e.code||''))}
    syncStatus();
  }
}

/* ---------- shared jars ---------- */
const FV=()=>firebase.firestore.FieldValue;
const myUid=()=>Cloud.user&&Cloud.user.uid;
const myEmail=()=>((Cloud.user&&Cloud.user.email)||'').toLowerCase();
const myName=()=>(Cloud.user&&(Cloud.user.displayName||(Cloud.user.email||'').split('@')[0]))||'我';
const jarsList=()=>Object.keys(Cloud.jars).map(id=>Object.assign({id},Cloud.jars[id])).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const isMirror=t=>t.kind==='contrib'||(t.id||'').startsWith('m_');
function nameOf(id){if(isSJ(id)){const j=Cloud.jars[sjId(id)];return (j?j.name:((S.jarPlan||{})[sjId(id)]||{}).name||'共用罐')+'（共用）'}const b=bucketById(id);return b?b.name:'—'}
function colorOf(id){if(isSJ(id)){const j=Cloud.jars[sjId(id)];return j?j.color:'#999'}const b=bucketById(id);return b?b.color:'#999'}
function memberName(j,uid){const m=(j.memberInfo||{})[uid];return m?(m.name||m.email):'成員'}

function stopJars(){
  if(Cloud.jarsUnsub){try{Cloud.jarsUnsub()}catch(e){}}Cloud.jarsUnsub=null;
  for(const id in Cloud.jarUnsubs){try{Cloud.jarUnsubs[id]()}catch(e){}}
  Cloud.inviteUnsubs.forEach(f=>{try{f()}catch(e){}});
  Object.assign(Cloud,{jars:{},jarTxns:{},jarLoaded:{},jarUnsubs:{},inviteUnsubs:[],invites:[],sent:[],jarsLoaded:false});
}
function startJars(){
  if(!cloudOn()||Cloud.jarsUnsub)return;
  const uidv=myUid();
  Cloud.jarsUnsub=Cloud.fs.collection('jars').where('members','array-contains',uidv).onSnapshot(qs=>{
    const seen={};
    qs.docs.forEach(d=>{
      seen[d.id]=1;
      if(!(d.metadata.hasPendingWrites&&Cloud.jars[d.id]))Cloud.jars[d.id]=d.data();
      if(!Cloud.jarUnsubs[d.id])watchJarTxns(d.id);
    });
    for(const id in Cloud.jars)if(!seen[id]){delete Cloud.jars[id];if(Cloud.jarUnsubs[id]){Cloud.jarUnsubs[id]();delete Cloud.jarUnsubs[id]}delete Cloud.jarTxns[id];delete Cloud.jarLoaded[id]}
    // keep my contribution plan in step with membership
    let changed=false;S.jarPlan=S.jarPlan||{};
    for(const id in Cloud.jars){const jp=S.jarPlan[id];
      if(!jp){S.jarPlan[id]={from:curMonth(),hist:[{m:curMonth(),amt:0,src:defaultSrc()}],name:Cloud.jars[id].name};changed=true}
      else if(jp.until||jp.name!==Cloud.jars[id].name){if(jp.until&&jp.until<=curMonth())jp.from=curMonth();delete jp.until;jp.name=Cloud.jars[id].name;changed=true}}
    if(!qs.metadata.fromCache){
      for(const id in S.jarPlan){if(!Cloud.jars[id]&&!S.jarPlan[id].until){S.jarPlan[id].until=shiftMonth(curMonth(),1);changed=true}}
    }
    Cloud.jarsLoaded=true;
    if(changed)persist();
    safeRender();scheduleMirror();
  },e=>{Cloud.err='共用罐同步中斷：'+(e.code||e.message);renderIfSettings()});
  watchInvites();
}
function watchJarTxns(jid){
  Cloud.jarUnsubs[jid]=Cloud.fs.collection('jars').doc(jid).collection('txns').onSnapshot(qs=>{
    Cloud.jarTxns[jid]=qs.docs.map(d=>Object.assign({},d.data(),{id:d.id,jid}));
    Cloud.jarLoaded[jid]=true;safeRender();scheduleMirror();
  },()=>{});
}
function watchInvites(){
  Cloud.inviteUnsubs.forEach(f=>{try{f()}catch(e){}});Cloud.inviteUnsubs=[];
  const col=Cloud.fs.collection('invites');
  Cloud.inviteUnsubs.push(col.where('owner','==',myUid()).onSnapshot(qs=>{Cloud.sent=qs.docs.map(d=>Object.assign({id:d.id},d.data()));renderIfSettings()},()=>{}));
  if(Cloud.user.emailVerified&&myEmail()){
    Cloud.inviteUnsubs.push(col.where('email','==',myEmail()).onSnapshot(qs=>{Cloud.invites=qs.docs.map(d=>Object.assign({id:d.id},d.data()));safeRender()},()=>{}));
  }
}

/* contributions and transfers I make are mirrored into the shared jar so every member sees them */
function desiredMirrors(jid){
  const me=myUid(),nm=myName(),key=SJ+jid,jp=(S.jarPlan||{})[jid],res={};
  if(jp&&jp.from)for(let mk=jp.from,hz=horizon();mk<=hz;mk=shiftMonth(mk,1)){const c=jarContrib(jp,mk);
    if(c)res['contrib_'+me+'_'+mk]={kind:'contrib',amount:c.amt,date:mk+'-01',note:'',by:me,byName:nm,src:nameOf(c.src),srcId:c.src}}
  for(const t of S.txns){
    if(t.type==='transfer'&&t.to===key)res['m_'+t.id]={kind:'in',amount:t.amount,date:t.date,note:t.note||'',by:me,byName:nm,src:nameOf(t.from)};
    else if(t.type==='transfer'&&t.from===key)res['m_'+t.id]={kind:'withdraw',amount:t.amount,date:t.date,note:t.note||'',by:me,byName:nm,src:nameOf(t.to)};
    else if(t.type==='income'&&t.mode==='one'&&t.target===key)res['m_'+t.id]={kind:'in',amount:t.amount,date:t.date,note:t.note||'收入',by:me,byName:nm,src:''};
  }
  return res;
}
let mirrorTimer=null;
function scheduleMirror(){clearTimeout(mirrorTimer);mirrorTimer=setTimeout(syncMirrors,1200)}
function syncMirrors(){
  if(!cloudOn()||!Cloud.ledgerLoaded||!Cloud.jarsLoaded)return;
  const me=myUid(),sig=t=>[t.kind,t.amount,t.date,t.note||'',t.byName||'',t.src||'',t.srcId||''].join('|');
  for(const jid in Cloud.jars){
    if(!Cloud.jarLoaded[jid])continue;
    const want=desiredMirrors(jid),have={};
    (Cloud.jarTxns[jid]||[]).forEach(t=>{if(t.by===me&&isMirror(t))have[t.id]=t});
    const col=Cloud.fs.collection('jars').doc(jid).collection('txns');
    for(const id in want)if(!have[id]||sig(have[id])!==sig(want[id]))col.doc(id).set(want[id]).catch(()=>{});
    for(const id in have)if(!want[id])col.doc(id).delete().catch(()=>{});
  }
}

/* jar management */
async function createJar(){
  if(!cloudOn())return;
  const ref=Cloud.fs.collection('jars').doc();
  const used=S.buckets.map(b=>b.color).concat(jarsList().map(j=>j.color));
  const color=PALETTE.find(c=>!used.includes(c))||PALETTE[3];
  const data={name:'共用罐',color,owner:myUid(),members:[myUid()],memberInfo:{[myUid()]:{name:myName(),email:myEmail()}},
    categories:[{id:uid(),emoji:'🏠',name:'房租'},{id:uid(),emoji:'🛒',name:'家用'},{id:uid(),emoji:'🍽️',name:'聚餐'}],
    createdAt:FV().serverTimestamp(),updatedAt:FV().serverTimestamp()};
  S.jarPlan=S.jarPlan||{};S.jarPlan[ref.id]={from:curMonth(),hist:[{m:curMonth(),amt:0,src:defaultSrc()}],name:data.name};
  Cloud.jars[ref.id]=data;persist();render();
  try{await ref.set(data);toast('已建立共用罐，可以改名並邀請對方')}catch(e){toast('建立失敗：'+(e.code||''))}
}
function saveJarMeta(jid,fields){
  clearTimeout(Cloud.jarTimers[jid]);
  Cloud.jarTimers[jid]=setTimeout(()=>{
    const j=Cloud.jars[jid];if(!j)return;const up={updatedAt:FV().serverTimestamp()};
    fields.forEach(f=>up[f]=clean(j[f]));
    Cloud.fs.collection('jars').doc(jid).update(up).catch(e=>toast('共用罐沒有存到雲端：'+(e.code||'')));
  },600);
}
async function inviteTo(jid){
  const inp=document.getElementById('inv-'+jid);const email=(inp&&inp.value||'').trim().toLowerCase();
  const j=Cloud.jars[jid];if(!j)return;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('請輸入正確的 Email');return}
  if(email===myEmail()){toast('不能邀請自己');return}
  if(Object.values(j.memberInfo||{}).some(m=>(m.email||'').toLowerCase()===email)){toast('對方已經是成員了');return}
  try{
    await Cloud.fs.collection('invites').doc(email+'_'+jid).set({jid,owner:myUid(),email,jarName:j.name,fromName:myName(),createdAt:FV().serverTimestamp()});
    toast('邀請已送出，對方登入後就會看到');
  }catch(e){toast('邀請失敗：'+(e.code||''))}
}
async function acceptInvite(iid){
  const inv=Cloud.invites.find(x=>x.id===iid);if(!inv)return;
  try{
    const b=Cloud.fs.batch();
    b.update(Cloud.fs.collection('jars').doc(inv.jid),{members:FV().arrayUnion(myUid()),['memberInfo.'+myUid()]:{name:myName(),email:myEmail()},updatedAt:FV().serverTimestamp()});
    b.delete(Cloud.fs.collection('invites').doc(iid));
    await b.commit();
    toast(`已加入「${inv.jarName}」，到設定頁可以設定每月投入多少`);
  }catch(e){toast('加入失敗：'+(e.code||''))}
}
async function declineInvite(iid){try{await Cloud.fs.collection('invites').doc(iid).delete();toast('已婉拒')}catch(e){toast('操作失敗')}}
async function cancelInvite(iid){try{await Cloud.fs.collection('invites').doc(iid).delete();toast('已取消邀請')}catch(e){toast('操作失敗')}}
async function leaveJar(jid){
  const j=Cloud.jars[jid];if(!j)return;
  if(!confirm(`確定退出「${j.name}」？\n\n退出後這個罐子會從你的畫面消失，你之前投入的錢和記的紀錄會留在罐子裡。`))return;
  try{
    await Cloud.fs.collection('jars').doc(jid).update({members:FV().arrayRemove(myUid()),['memberInfo.'+myUid()]:FV().delete(),updatedAt:FV().serverTimestamp()});
    if(S.jarPlan[jid])S.jarPlan[jid].until=shiftMonth(curMonth(),1);
    persist();toast('已退出共用');
  }catch(e){toast('退出失敗：'+(e.code||''))}
}
async function removeMember(jid,u){
  const j=Cloud.jars[jid];if(!j)return;
  if(!confirm(`確定把「${memberName(j,u)}」移出「${j.name}」？對方記的紀錄會保留。`))return;
  try{await Cloud.fs.collection('jars').doc(jid).update({members:FV().arrayRemove(u),['memberInfo.'+u]:FV().delete(),updatedAt:FV().serverTimestamp()});toast('已移除成員')}
  catch(e){toast('移除失敗：'+(e.code||''))}
}
async function deleteJar(jid){
  const j=Cloud.jars[jid];if(!j)return;
  if(!confirm(`確定刪除「${j.name}」？\n\n罐子和裡面所有人的紀錄都會刪除，無法復原。罐子裡如果還有錢，建議先轉回各自的罐子。`))return;
  try{
    const ref=Cloud.fs.collection('jars').doc(jid);
    const qs=await ref.collection('txns').get();
    for(let i=0;i<qs.docs.length;i+=400){const b=Cloud.fs.batch();qs.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}
    for(const inv of Cloud.sent.filter(x=>x.jid===jid))await Cloud.fs.collection('invites').doc(inv.id).delete();
    await ref.delete();
    if(S.jarPlan[jid])S.jarPlan[jid].until=shiftMonth(curMonth(),1);
    persist();toast('已刪除共用罐');
  }catch(e){toast('刪除失敗：'+(e.code||''))}
}
async function sendVerify(){try{await Cloud.user.sendEmailVerification();toast('驗證信已寄出，請到信箱點連結')}catch(e){toast('寄送失敗：'+(e.code||''))}}
async function checkVerified(){
  try{await Cloud.user.reload();Cloud.user=Cloud.auth.currentUser;await Cloud.user.getIdToken(true)}catch(e){}
  if(Cloud.user.emailVerified){toast('Email 已驗證');watchInvites()}else toast('還沒有驗證成功，請到信箱點驗證連結');
  renderIfSettings();
}

function invitesHtml(){
  return Cloud.invites.map(inv=>`<div class="acct invite"><div><b>${esc(inv.fromName||'有人')}</b> 邀請你共用「<b>${esc(inv.jarName||'共用罐')}</b>」罐子</div>

const AUTH_MSG={'auth/invalid-email':'Email 格式不正確','auth/invalid-credential':'Email 或密碼不正確','auth/wrong-password':'Email 或密碼不正確','auth/user-not-found':'找不到這個帳號，請先建立帳號','auth/email-already-in-use':'這個 Email 已經註冊過，請直接登入','auth/weak-password':'密碼至少需要 6 個字元','auth/popup-blocked':'登入視窗被擋住了，請允許彈出視窗後再試','auth/popup-closed-by-user':'登入視窗已關閉','auth/unauthorized-domain':'這個網址還沒加入 Firebase 的授權網域','auth/operation-not-allowed':'Firebase 還沒開啟這種登入方式','auth/network-request-failed':'需要網路連線才能登入','auth/too-many-requests':'嘗試次數太多，請稍後再試'};
async function authDo(kind){
  if(!Cloud.ready)return;
  Cloud.err='';Cloud.busy=true;renderIfSettings();
  try{
    if(kind==='google'){await Cloud.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
    else{
      const em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value;
      if(kind==='signup')await Cloud.auth.createUserWithEmailAndPassword(em,pw);
      else if(kind==='login')await Cloud.auth.signInWithEmailAndPassword(em,pw);
      else if(kind==='resetpw'){await Cloud.auth.sendPasswordResetEmail(em);toast('重設密碼信已寄出')}
    }
  }catch(e){Cloud.err=AUTH_MSG[e.code]||('登入失敗：'+(e.code||e.message))}
  Cloud.busy=false;renderIfSettings();
}

function setAllocMode(m){
  if(S.allocMode===m||(m==='pct'&&!S.allocMode))return;
  let filled=false;
  if(m==='amount'&&planSum()===0){ // first switch: suggest amounts from the latest month's income
    const pt=planTotals(),mk=Object.keys(pt).sort().pop(),T=mk?pt[mk]:0;
    const tot=targets().reduce((a,b)=>a+b.pct,0)||1;
    if(T>0){S.buckets.forEach(b=>b.amt=Math.round(T*(+b.pct||0)/tot/100)*100);filled=true}
    if(!bucketById(S.remainderId))S.remainderId=(S.buckets.find(b=>/彈性/.test(b.name))||S.buckets[S.buckets.length-1]).id;
  }
  S.allocMode=m;persist();render();
  if(filled)toast('已依最近一個月的收入先填入建議金額，可以再調整');
}
function migrate(){
  for(const t of S.txns){
    if(t.type!=='income'||t.mode)continue;
    const ks=Object.keys(t.alloc||{}).filter(k=>t.alloc[k]);
    const active=S.buckets.filter(b=>+b.pct>0).length;
    if(ks.length===1&&active>1){t.mode='one';t.target=ks[0]}else t.mode='pct';
    delete t.alloc;
  }
}

// look for a newer deploy when the app comes back to the foreground (at most every 15 minutes)
async function checkUpdate(force){
  if(!navigator.onLine||(!force&&Date.now()-lastCheck<15*60000))return;
  lastCheck=Date.now();
  try{
    const r=await fetch('./index.html',{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION){newVer=m[1];updateBell()}
  }catch(e){}
}

/* ---------- calculations ---------- */
const bucketById=id=>S.buckets.find(b=>b.id===id);
const catById=id=>S.categories.find(c=>c.id===id);
const SJ='sj:';
const isSJ=id=>typeof id==='string'&&id.startsWith(SJ);
const sjId=id=>id.slice(SJ.length);
const jarActive=(jp,mk)=>!!jp&&(!jp.from||mk>=jp.from)&&(!jp.until||mk<jp.until);
function targets(mk){return S.buckets.map(b=>({id:b.id,pct:+b.pct||0,amt:+b.amt||0}))}
// my contribution plan for a shared jar: hist = [{m:'YYYY-MM', amt, src}] — each entry applies from its month on
function defaultSrc(){const b=S.buckets.find(b=>/日常/.test(b.name))||S.buckets.find(b=>!isRemainder(b))||S.buckets[0];return b?b.id:null}
function jarEff(jp,mk){if(!jp||!jp.hist)return null;let e=null;for(const x of jp.hist)if(x.m<=mk)e=x;return e}
function jarContrib(jp,mk){ // {amt,src} moved in month mk (up to the furthest month in view)
  if(!jarActive(jp,mk)||mk>horizon())return null;
  const e=jarEff(jp,mk);if(!e||!(+e.amt>0)||!bucketById(e.src))return null;
  return {amt:+e.amt,src:e.src};
}
function setJarPlan(jid,field,val){ // changes take effect from the current month; past months keep their amount
  const jp=(S.jarPlan||{})[jid];if(!jp)return;
  jp.hist=jp.hist||[];const m=curMonth(),last=jp.hist[jp.hist.length-1];
  const base=jarEff(jp,m)||{amt:0,src:defaultSrc()};
  if(last&&last.m===m)last[field]=val;
  else jp.hist.push(Object.assign({m:(jp.from&&jp.from>m)?jp.from:m,amt:base.amt,src:base.src},{[field]:val}));
}
function migrateJarPlan(){
  let changed=false;
  for(const jid in (S.jarPlan||{})){const jp=S.jarPlan[jid];
    if(!jp.hist){jp.hist=[{m:jp.from||curMonth(),amt:+jp.amt||0,src:defaultSrc()}];delete jp.amt;delete jp.pct;changed=true}}
  return changed;
}
function allocate(amount,mode,target,mk){
  const res={};
  if(mode==='one'){res[target]=amount;return res}
  const ts=targets(mk),tot=ts.reduce((a,b)=>a+b.pct,0)||1;
  let rem=amount;
  ts.forEach((b,i)=>{const v=i===ts.length-1?rem:Math.round(amount*b.pct/tot);res[b.id]=v;rem-=v});
  return res;
}
const isPlan=t=>t.type==='income'&&t.mode!=='one';
let planCache=null;
function planTotals(excludeId){ // month -> total of plan-following income
  if(!excludeId&&planCache)return planCache;
  const m={};
  for(const t of S.txns){if(isPlan(t)&&t.id!==excludeId){const k=t.date.slice(0,7);m[k]=(m[k]||0)+t.amount}}
  if(!excludeId)planCache=m;
  return m;
}
const planSum=mk=>targets(mk).reduce((a,b)=>a+Math.max(0,b.amt),0);
function remainderBucket(){return bucketById(S.remainderId)||S.buckets[S.buckets.length-1]}
function planAlloc(T,mk){ // how one month's plan income is split
  const ts=targets(mk),res={};ts.forEach(b=>res[b.id]=0);
  if(T<=0||!S.buckets.length)return res;
  if(S.allocMode!=='amount')return Object.assign(res,allocate(T,'pct',null,mk));
  const rid=remainderBucket().id,P=planSum(mk);
  if(P<=0){res[rid]=T;return res}
  if(T>=P){ts.forEach(b=>res[b.id]=Math.max(0,b.amt));res[rid]+=T-P;return res}
  const bs=ts.filter(b=>b.amt>0);let rem=T;
  bs.forEach((b,i)=>{const v=i===bs.length-1?rem:Math.round(T*b.amt/P);res[b.id]=v;rem-=v});
  return res;
}
function incAlloc(t){ // this income's share of its month
  if(t.mode==='one')return {[t.target]:t.amount};
  const mk=t.date.slice(0,7),T=planTotals()[mk]||t.amount,a=planAlloc(T,mk),r={};
  for(const k in a)r[k]=Math.round(a[k]*t.amount/T);
  return r;
}
const curMonth=()=>today().slice(0,7);
// furthest month in view: the current month, or the latest month you've recorded something in
let horizonCache=null;
function horizon(){if(horizonCache)return horizonCache;return horizonCache=S.txns.reduce((a,t)=>t.date.slice(0,7)>a?t.date.slice(0,7):a,curMonth())}
function shiftMonth(mk,d){const [y,m]=mk.split('-').map(Number);const dt=new Date(y,m-1+d,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')}
const isRemainder=b=>!!b&&remainderBucket()&&remainderBucket().id===b.id;
const carries=b=>b.carry!==false||isRemainder(b); // the designated jar always carries
// balances for one month: open (carried in) + this month's in − out
function stats(excludeId,month){
  month=month||curMonth();
  const per={};S.buckets.forEach(b=>per[b.id]={});
  const add=(id,mk,f,v)=>{const p=per[id];if(!p)return;(p[mk]||(p[mk]={i:0,o:0,j:0}))[f]+=v};
  for(const t of S.txns){
    if(t.id===excludeId)continue;
    const mk=t.date.slice(0,7);if(mk>month)continue;
    if(t.type==='income'){if(t.mode==='one')add(t.target,mk,'i',t.amount)}
    else if(t.type==='expense')add(t.bucketId,mk,'o',t.amount);
    else if(t.type==='transfer'){add(t.from,mk,'o',t.amount);add(t.to,mk,'i',t.amount)}
  }
  const pt=planTotals(excludeId);
  for(const mk in pt){if(mk>month)continue;const a=planAlloc(pt[mk],mk);for(const k in a)if(a[k])add(k,mk,'i',a[k])}
  for(const jid in (S.jarPlan||{})){const jp=S.jarPlan[jid];
    for(let mk=jp.from||month;mk<=month;mk=shiftMonth(mk,1)){const c=jarContrib(jp,mk);if(c){add(c.src,mk,'o',c.amt);add(c.src,mk,'j',c.amt)}}}
  // walk month by month: carrying jars keep their balance; reset jars settle at month end into the designated jar
  const rem=remainderBucket();
  const months=new Set([month]);for(const id in per)for(const mk in per[id])months.add(mk);
  const bal={},out={};S.buckets.forEach(b=>bal[b.id]=0);
  let lastSweep=0,lastParts=[],lastMk=null;
  for(const mk of [...months].sort()){
    const isTarget=mk===month;
    for(const b of S.buckets){
      const cur=per[b.id][mk]||{i:0,o:0,j:0};
      if(isTarget)out[b.id]={open:bal[b.id],monthIn:cur.i,monthOut:cur.o,monthJar:cur.j,bal:bal[b.id]+cur.i-cur.o,sweep:0};
      bal[b.id]+=cur.i-cur.o;
    }
    if(isTarget)break;
    let sweep=0;const parts=[];
    for(const b of S.buckets){if(!carries(b)){if(bal[b.id])parts.push({id:b.id,amount:bal[b.id]});sweep+=bal[b.id];bal[b.id]=0}}
    if(rem)bal[rem.id]+=sweep;
    lastSweep=sweep;lastParts=parts;lastMk=mk;
  }
  if(rem&&out[rem.id]){out[rem.id].sweep=lastSweep;out[rem.id].sweepParts=lastParts;out[rem.id].sweepMonth=lastMk}
  return out;
}

const jarIn=t=>t.kind==='contrib'||t.kind==='in';
function jarStats(jid,month,excludeId){ // shared jars always carry over
  month=month||curMonth();let open=0,mi=0,mo=0;
  for(const t of (Cloud.jarTxns[jid]||[])){
    if(t.id===excludeId)continue;
    const mk=t.date.slice(0,7);if(mk>month)continue;

function setPieAngle(a){pieAngle=((a%360)+360)%360;const g=document.getElementById('pieRing');if(g)g.setAttribute('transform',`rotate(${pieAngle} 60 60)`)}
function stopPieSpin(){if(pieRAF)cancelAnimationFrame(pieRAF);pieRAF=0}
function resetPie(){stopPieSpin();pieAngle=0}
(function(){
  const ang=(e,r)=>Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;
  document.addEventListener('pointerdown',e=>{
    const svg=e.target.closest('#pieSvg');if(!svg||motionPref()==='off')return;
    stopPieSpin();
    const r=svg.getBoundingClientRect();
    pieSpin={r,last:ang(e,r),moved:0,v:0,t:performance.now()};
  });
  document.addEventListener('pointermove',e=>{
    if(!pieSpin)return;
    let a=ang(e,pieSpin.r),da=a-pieSpin.last;
    if(da>180)da-=360;if(da<-180)da+=360;
    const now=performance.now(),dt=Math.max(1,now-pieSpin.t);
    pieSpin.v=pieSpin.v*0.6+(da/dt)*0.4;pieSpin.last=a;pieSpin.t=now;pieSpin.moved+=Math.abs(da);
    if(pieSpin.moved>6)setPieAngle(pieAngle+da);
  });
  const end=()=>{
    if(!pieSpin)return;
    const s=pieSpin;pieSpin=null;
    if(s.moved<=6)return; // a tap: let the slice click through
    suppressClick=true;setTimeout(()=>suppressClick=false,400);
    if(motionPref()!=='standard'||performance.now()-s.t>80)return;
    let v=Math.max(-2.5,Math.min(2.5,s.v)),prev=performance.now();
    const step=now=>{
      const dt=Math.min(50,now-prev);prev=now;
      v*=Math.pow(0.9965,dt);setPieAngle(pieAngle+v*dt);
      if(Math.abs(v)>0.005&&document.getElementById('pieRing'))pieRAF=requestAnimationFrame(step);else pieRAF=0;
    };
    pieRAF=requestAnimationFrame(step);
  };
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',()=>{pieSpin=null});
})();

  const catOf=t=>t.jid?(t.kind==='expense'?(t.catKey||t.catName||'?'):null):(t.type==='expense'?(t.catId||'?'):null);
  let shown=listCat?items.filter(t=>catOf(t)===listCat):items;
  if(q)shown=shown.filter(t=>noteMatch(t,terms));
  const sys=(!q&&!listCat)?sysItems(listMonth,listBucket):[];
  let html='',last='',sumOut=0,sumIn=0,shOut=0,shMine=0,toJar=0;
  for(const t of items){
    if(t.jid){
      if(t.kind==='expense'){shOut+=t.amount;shMine+=myShare(t)}
      else if(isSJ(listBucket)){if(jarIn(t))sumIn+=t.amount}
      else if(t.kind==='contrib'&&t.by===myUid())toJar+=t.amount;
    }
    else{
      if(t.type==='expense')sumOut+=t.amount;
      if(t.type==='income')sumIn+=listBucket==='all'?t.amount:(incAlloc(t)[listBucket]||0);
    }
  }
  // daily spending: my own expenses, plus my share of shared ones (full amount when viewing a shared jar)
  const spendOf=t=>t.jid?(t.kind==='expense'?(isSJ(listBucket)?t.amount:myShare(t)):0):(t.type==='expense'?t.amount:0);
  const daySpend={};let found=0;
  for(const t of shown){const v=spendOf(t);found+=v;if(v)daySpend[t.date]=(daySpend[t.date]||0)+v}
  for(const t of shown){
    if(t.date!==last){if(last)html+='</ul>';const d=new Date(t.date+'T00:00');const ds=daySpend[t.date];
      const yr=all?d.getFullYear()+'年':'';
      html+=`<div class="day"><span>${yr}${d.getMonth()+1}月${d.getDate()}日 週${'日一二三四五六'[d.getDay()]}</span>${ds?`<span class="dsum num">支出 ${money(ds)}</span>`:''}</div><ul class="txs">`;last=t.date}
    html+=rowOf(t);
  }
  if(last)html+='</ul>';
  let catLabel='';
  if(listCat){const s=(pieData().slices.find(s=>s.key===listCat)||{});const c=resolveCat(listCat);catLabel=s.name||(c&&c.name)||'這個分類'}
  const totalLine=q
    ?`<div class="total"><span>${all?'所有月份':'這個月'}</span><span class="num" style="text-align:right">找到 <b>${shown.length}</b> 筆　支出 <b>${money(found)}</b></span></div>`
    :`<div class="total"><span>這個月</span><span class="num" style="text-align:right">${isSJ(listBucket)
      ?`共用支出 <b>${money(shOut)}</b>（你的份額 ${money(shMine)}）<br>撥入 <b>${money(sumIn)}</b>`
      :`個人支出 <b>${money(sumOut)}</b>　收入 <b>${money(sumIn)}</b>${toJar?`<br>撥到共用罐 ${money(toJar)}`:''}${shOut?`<br>共用支出 ${money(shOut)}（你的份額 <b>${money(shMine)}</b>）`:''}`}</span></div>`;
  const empty=q?`<div class="empty">${all?'所有月份':'這個月'}沒有符合「${esc(listQuery.trim())}」的紀錄。${all?'':'<br>可以切換到「所有月份」試試看。'}</div>`:'<div class="empty">這個月還沒有紀錄。</div>';
  return `${settleHtml(sys)}${totalLine}
    ${q?'':pieHtml()}
    ${listCat?`<button class="catfilter" data-action="pie" data-key="${esc(listCat)}">只看：${esc(catLabel)}　✕</button>`:''}
    ${html||empty}`;
}
// mark search terms inside the rendered rows (text only, never inside tags)
function highlightTerms(root){
  const terms=searchTerms();if(!terms.length||!root)return;
  const re=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  root.querySelectorAll('.tx .t1, .tx .t2').forEach(el=>{
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];
    while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{if(!re.test(n.nodeValue))return;re.lastIndex=0;
      const span=document.createElement('span');span.innerHTML=esc(n.nodeValue).replace(re,'<mark>$1</mark>');n.replaceWith(...span.childNodes)});
  });
}

function daysIn(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()}
function monthData(mk){
  const me=myUid();
  const inc=S.txns.filter(t=>t.type==='income'&&t.date.slice(0,7)===mk).reduce((a,t)=>a+t.amount,0);
  const exps=[];
  for(const t of S.txns)if(t.type==='expense'&&t.date.slice(0,7)===mk){const c=catById(t.catId);exps.push({key:t.catId||'?',name:c?c.name:'已刪除分類',emoji:c?c.emoji:'🧾',amount:t.amount,full:t.amount,date:t.date,note:t.note||'',shared:false,mine:true})}
  for(const j of jarsList())for(const t of (Cloud.jarTxns[j.id]||[]))if(t.kind==='expense'&&t.date.slice(0,7)===mk)
    exps.push({key:'s:'+(t.catKey||t.catName||'?'),name:t.catName||'共用支出',emoji:t.emoji||'🧾',amount:myShare(t),full:t.amount,date:t.date,note:t.note||'',shared:true,jar:j.name,mine:t.by===me,by:t.by===me?'你':(t.byName||'成員')});
  const spend=exps.reduce((a,e)=>a+e.amount,0);
  const cats={};for(const e of exps){const g=cats[e.key]||(cats[e.key]={key:e.key,name:e.name,emoji:e.emoji,shared:e.shared,value:0,count:0,n:0});g.value+=e.amount;g.n++;if(e.mine)g.count++}
  const st=stats(null,mk);
  const jars=S.buckets.map(b=>{const s=st[b.id]||{open:0,monthIn:0,monthOut:0,bal:0};return {name:b.name,color:b.color,avail:Math.max(0,s.open)+s.monthIn,spent:s.monthOut,bal:s.bal}});
  const sjars=jarsList().map(j=>{const s=jarStats(j.id,mk);return {name:j.name,color:j.color,avail:Math.max(0,s.open)+s.monthIn,spent:s.monthOut,bal:s.bal,shared:true}});
  return {mk,inc,spend,net:inc-spend,exps,cats:Object.values(cats).sort((a,b)=>b.value-a.value),jars,sjars,
    over:jars.filter(j=>j.bal<0).length,has:inc>0||spend>0};
}
function gradeOf(d){
  const r=gradeRules();
  if(d.inc>0){
    const rate=d.net/d.inc;
    if(d.over===0&&rate>=r.sRate)return 'S';
    if(d.over===0&&rate>=r.aRate)return 'A';
    if(d.over<=r.bMaxOver&&d.net>=0)return 'B';
    return 'C';
  }
  return d.over===0?'A':d.over<=r.bMaxOver?'B':'C';
}
function pickComment(list,mk){let h=0;for(const c of mk)h=(h*31+c.charCodeAt(0))>>>0;return list[h%list.length]}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function delta(cur,prev,kind,L){
  const d=cur-prev;if(!d)return `<span class="flat">${L.same}</span>`;
  const p=prev?`（${d>0?'+':'−'}${Math.abs(pct(d,Math.abs(prev)))}%）`:'';
  if(kind==='spend')return d>0?`<span class="bad">${L.moreSpend} ${money(d)}${p}</span>`:`<span class="good">${L.lessSpend} ${money(-d)}${p}</span>`;
  if(kind==='save')return d>0?`<span class="good">${L.moreSave} ${money(d)}</span>`:`<span class="bad">${L.lessSave} ${money(-d)}</span>`;
  return d>0?`<span class="good">${L.moreInc} ${money(d)}${p}</span>`:`<span class="flat">${L.lessInc} ${money(-d)}${p}</span>`;
}

function countUp(root){
  root.querySelectorAll('[data-count]').forEach((n,k)=>{
    const end=+n.dataset.count,delay=440+k*140,dur=900;let t0=null;n.textContent=money(0);
    const step=t=>{if(!n.isConnected)return;if(root.classList.contains('still')){n.textContent=money(end);return}
      if(t0===null)t0=t;const x=Math.min(1,Math.max(0,(t-t0-delay)/dur));const e=1-Math.pow(1-x,3);n.textContent=money(end*e);if(x<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

function lockScroll(){ // keep the page behind the sheet still (iPhone ignores overflow:hidden on its own)

/* drag the top of the sheet down to dismiss */
(function(){
  const sh=()=>document.getElementById('sheet'),sc=()=>document.getElementById('scrim');
  let d=null;
  document.addEventListener('pointerdown',e=>{
    if(!e.target.closest('#sheetHandle')||!sh().classList.contains('open'))return;
    d={y0:e.clientY,y:e.clientY,t:performance.now(),v:0,h:sh().offsetHeight};
    sh().style.transition='none';
    try{e.target.setPointerCapture(e.pointerId)}catch(_){}
  });
  document.addEventListener('pointermove',e=>{
    if(!d)return;
    const now=performance.now(),dt=Math.max(1,now-d.t);
    d.v=(e.clientY-d.y)/dt;d.y=e.clientY;d.t=now;
    const dy=Math.max(0,e.clientY-d.y0);
    sh().style.transform=`translateY(${dy}px)`;
    sc().style.opacity=String(Math.max(0,1-dy/d.h));
  });
  const end=()=>{
    if(!d)return;
    const dy=Math.max(0,d.y-d.y0),flick=d.v>0.6&&dy>20;
    sh().style.transition='';
    if(dy>d.h*0.25||flick)closeSheet();
    else{sh().style.transform='';sc().style.opacity=''}
    d=null;
  };
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
})();

/* calculator: expression like "120+85×2", evaluated with × ÷ before + − */
const OPS='+−×÷';
const hasOp=x=>/[+−×÷]/.test(x.replace(/^−/,''));
function evalExpr(x){
  if(!x)return null;
  const toks=x.match(/\d+\.?\d*|\.\d+|[+−×÷]/g);if(!toks||toks.join('')!==x)return null;
  if(OPS.includes(toks[toks.length-1]))return null;
  const nums=[],ops=[];
  const ap=()=>{const b=nums.pop(),a=nums.pop(),o=ops.pop();nums.push(o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:(b===0?NaN:a/b))};
  const pr=o=>o==='×'||o==='÷'?2:1;
  for(const t of toks){
    if(OPS.includes(t)){while(ops.length&&pr(ops[ops.length-1])>=pr(t))ap();ops.push(t)}
    else nums.push(parseFloat(t));
  }
  while(ops.length)ap();
  const r=nums[0];return Number.isFinite(r)?r:null;
}
const fmtNum=s=>{const [i,dec]=s.split('.');return (i?Number(i).toLocaleString('zh-TW'):'0')+(dec!==undefined?'.'+dec:'')};
const fmtExpr=x=>x.replace(/\d+\.?\d*|\.\d+/g,m=>fmtNum(m)).replace(/([+−×÷])/g,' $1 ');
function amountInner(){
  const x=draft.expr||'',r=evalExpr(x);
  const show=hasOp(x)?fmtExpr(x):'';
  let res;
  if(!x)res='<div class="res num empty">$0</div>';
  else if(r===null)res=`<div class="res num">${hasOp(x)?'—':'$'+fmtNum(x)}</div>`;
  else res=`<div class="res num">${Math.round(r)!==r?'<small>≈</small>':''}${r<0?'−':''}$${Math.abs(Math.round(r)).toLocaleString('zh-TW')}</div>`;
  return `<div class="expr num">${esc(show)}</div>${res}`;
}
function syncAmount(){
  const r=evalExpr(draft.expr||'');
  draft.amount=r!==null&&Math.round(r)>0?String(Math.round(r)):'';
  const a=document.getElementById('amtBox');if(a)a.innerHTML=amountInner();
  updateHint();

    ${k('7')}${k('8')}${k('9')}${k('−','−','op')}
    ${k('4')}${k('5')}${k('6')}${k('+','+','op')}
    ${k('1')}${k('2')}${k('3')}<button type="button" class="go" id="kpGo" data-action="kp" data-k="go">✓ 記下</button>
    ${k('00')}${k('0')}${k('.')}</div>`;

function pressKey(k){
  if(!draft)return;
  let x=draft.expr||'';
  const cur=(x.match(/(\d+\.?\d*|\.\d+)$/)||[''])[0];
  const last=x.slice(-1);
  if(k==='AC')x='';
  else if(k==='del')x=x.slice(0,-1);
  else if(k==='go'){
    if(hasOp(x)){const r=evalExpr(x);if(r===null)return;if(r<=0){toast('金額要大於 0');return}x=String(Math.round(r*100)/100)}
    else{if(draft.ok)saveDraft();return}
  }
  else if(OPS.includes(k)){
    if(!x)return;
    if(last==='.')x=x.slice(0,-1);
    if(OPS.includes(x.slice(-1)))x=x.slice(0,-1)+k;else x+=k;
  }
  else if(k==='.'){if(cur.includes('.'))return;x+=cur?'.':'0.'}
  else{ // digits and 00
    if(x.replace(/[^\d]/g,'').length>=15)return;
    if(cur==='0')x=x.slice(0,-1)+(k==='00'?'0':k);
    else if(!cur&&k==='00')x+='0';
    else x+=k;
  }
  draft.expr=x;syncAmount();
}

function topCats(n){

function updateHint(){
  const d=draft;if(!d)return;const h=document.getElementById('hint');const btn=document.getElementById('saveBtn');
  const amt=Math.round(+d.amount||0),mk=(d.date||today()).slice(0,7);let ok=amt>0,msg='';
  const exShared=d.editShared?d.editShared.id:undefined;
  if(d.type==='expense'){
    const c=resolveCat(d.catId);ok=ok&&!!c;
    if(c){const id=c.shared?SJ+c.jid:c.bucketId;const after=(c.shared?jarStats(c.jid,mk,exShared).bal:balanceOf(id,mk,d.editId))-amt;
      msg=`從「<b>${esc(nameOf(id))}</b>」扣除，扣完剩 <span class="${after<0?'neg':''}">${money(after)}</span>${after<0?'（會超支）':''}`}
    else msg='選一個分類';
  }else if(d.type==='income'){
    if(amt>0){
      let a;
      if(d.mode==='one')a=allocate(amt,'one',d.target);
      else{
        const T0=planTotals(d.editId)[mk]||0,a0=planAlloc(T0,mk),a1=planAlloc(T0+amt,mk);
        a={};for(const k in a1)a[k]=a1[k]-(a0[k]||0);
        if(S.allocMode==='amount'){
          const P=planSum(mk),T=T0+amt;
          const tail=P<=0?'還沒設定每月計畫金額，會全部放入「'+esc(remainderBucket().name)+'」':T>=P?(T>P?`本月收入 ${money(T)}，超過計畫 ${money(T-P)}，多的放入「${esc(remainderBucket().name)}」`:`本月收入剛好達到計畫 ${money(P)}`):`本月收入 ${money(T)}，還差 ${money(P-T)} 達到計畫，先依比例分配`;
          msg='<br>'+tail;
        }
      }
      msg=Object.entries(a).filter(([,v])=>v).map(([k,v])=>`${esc(nameOf(k))} <b>${v<0?'−':'+'}${money(Math.abs(v))}</b>`).join('　')+msg;
    }
    else msg='輸入金額後會顯示分配結果';
  }else{
    const both=isSJ(d.from)&&isSJ(d.to);
    ok=ok&&d.from!==d.to&&!both;
    msg=d.from===d.to?'請選兩個不同的罐子':both?'共用罐之間不能直接轉移，請經過自己的罐子':`「${esc(nameOf(d.from))}」目前有 ${money(balanceOf(d.from,mk,d.editId))}`;
  }
  h.innerHTML=msg;d.ok=ok;updateKeypad();
}
function jarTxnRef(jid,id){return Cloud.fs.collection('jars').doc(jid).collection('txns').doc(id)}
function saveDraft(){
  const d=draft;const amt=Math.round(+d.amount||0);if(amt<=0)return;
  const oldP=d.editId?S.txns.find(t=>t.id===d.editId):null,oldS=d.editShared||null;
  const date=d.date||today(),note=(d.note||'').trim();
  const c=d.type==='expense'?resolveCat(d.catId):null;
  if(d.type==='expense'&&!c)return;
  if(c&&c.shared){ // goes into the shared jar
    if(!cloudOn()){toast('需要登入才能記到共用罐');return}
    const id=(oldS&&oldS.jid===c.jid)?oldS.id:uid();
    const keepSplit=oldS&&oldS.jid===c.jid&&oldS.split;
    const doc={kind:'expense',amount:amt,date,note,by:myUid(),byName:myName(),emoji:c.emoji,catName:c.name,catKey:c.key,split:keepSplit||((Cloud.jars[c.jid]||{}).members||[]).length||1,ts:(oldS&&oldS.ts)||Date.now()};
    jarTxnRef(c.jid,id).set(doc).catch(e=>toast('共用罐儲存失敗：'+(e.code||'')));
    if(oldS&&oldS.jid!==c.jid)jarTxnRef(oldS.jid,oldS.id).delete().catch(()=>{});
    if(oldP)removeTxn(oldP.id);
  }else{
    const base={id:oldP?oldP.id:uid(),ts:oldP?oldP.ts:Date.now(),type:d.type,amount:amt,date,note};
    if(d.type==='expense'){base.catId=c.key;base.bucketId=c.bucketId}
    else if(d.type==='income'){base.mode=d.mode;if(d.mode==='one')base.target=d.target}
    else{if(d.from===d.to||(isSJ(d.from)&&isSJ(d.to)))return;base.from=d.from;base.to=d.to}
    if((isSJ(base.target)||isSJ(base.from)||isSJ(base.to))&&!cloudOn()){toast('需要登入才能使用共用罐');return}
    putTxn(base);
    if(oldS)jarTxnRef(oldS.jid,oldS.id).delete().catch(()=>{});
  }
  closeSheet();render();toast(oldP||oldS?'已儲存變更':'已記下');
}

  openSheet(addHtml());
}
function openShared(jid,id){
  const t=(Cloud.jarTxns[jid]||[]).find(x=>x.id===id);if(!t)return;
  const me=myUid();
  if(t.by===me&&id.startsWith('m_')&&S.txns.find(x=>x.id===id.slice(2))){openTx(id.slice(2));return}
  if(t.by===me&&t.kind==='expense'){
    draft={editShared:{jid,id,ts:t.ts,split:t.split},type:'expense',amount:String(t.amount),date:t.date,note:t.note||'',catId:resolveCat(t.catKey)?t.catKey:null,mode:'pct'};
    openSheet(addHtml());return;
  }
  const why=t.by!==me?`這筆是 ${esc(t.byName||'成員')} 記的，只有記錄的人可以修改。`:t.kind==='contrib'?'這是你每月從自己的罐子撥進共用罐的金額。要調整的話，到設定頁修改這個共用罐的「每月撥款」。':'這筆由你的帳本自動產生。';
  openSheet(`<ul class="txs">${sharedRow(t,true)}</ul><p class="note">${t.date}</p><p class="note">${why}</p>
    <button class="ghost" style="width:100%;margin-top:10px" data-action="close">關閉</button>`);
}

let tt=null,undoFn=null;
function toast(m,undo){
  const el=document.getElementById('toast');undoFn=undo||null;
  el.innerHTML=esc(m)+(undo?'<button class="undo" data-action="undo">復原</button>':'');
  el.classList.toggle('act',!!undo);el.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>{el.classList.remove('show','act');undoFn=null},undo?4500:1600);
}

/* swipe left on a record to delete it */
const DELW=84;let sw=null,openLi=null,suppressClick=false;
function setX(li,x,anim){const b=li.querySelector('.tx');b.style.transition=anim?'':'none';b.style.transform=x?`translateX(${x}px)`:''}
function closeSwipe(){if(openLi){setX(openLi,0,true);openLi=null}}
document.addEventListener('pointerdown',e=>{
  const li=e.target.closest('li.swipe');
  if(openLi&&li!==openLi){closeSwipe();suppressClick=true;setTimeout(()=>suppressClick=false,400)}
  if(!li||e.target.closest('.del-act'))return;
  sw={li,x0:e.clientX,y0:e.clientY,dx:0,dir:null,base:li===openLi?-DELW:0};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(!sw)return;
  const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.dir){if(Math.abs(dx)<8&&Math.abs(dy)<8)return;sw.dir=Math.abs(dx)>Math.abs(dy)?'h':'v'}
  if(sw.dir!=='h')return;
  sw.dx=dx;setX(sw.li,Math.min(0,Math.max(-DELW*1.4,sw.base+dx)),false);
},{passive:true});
function endSwipe(){
  if(!sw)return;
  if(sw.dir==='h'){
    const x=sw.base+sw.dx;
    if(x<-DELW/2){setX(sw.li,-DELW,true);openLi=sw.li}else{setX(sw.li,0,true);if(openLi===sw.li)openLi=null}
    suppressClick=true;setTimeout(()=>suppressClick=false,400);
  }
  sw=null;
}
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',()=>{if(sw&&sw.dir==='h'){setX(sw.li,sw.base,true)}sw=null});
document.addEventListener('click',e=>{if(suppressClick&&!e.target.closest('.del-act')){e.preventDefault();e.stopPropagation();suppressClick=false}},true);

function swipeDelete(ref){
  openLi=null;
  if(ref.startsWith('p:')){
    const id=ref.slice(2),t=S.txns.find(x=>x.id===id);if(!t)return;
    const copy=JSON.parse(JSON.stringify(t));
    removeTxn(id);render();
    toast('已刪除',()=>{putTxn(copy);render();toast('已復原')});
  }else{
    const [,jid,id]=ref.split(':');const t=(Cloud.jarTxns[jid]||[]).find(x=>x.id===id);if(!t||!cloudOn())return;
    const {id:_i,jid:_j,...data}=t;
    jarTxnRef(jid,id).delete().catch(()=>toast('刪除失敗'));
    Cloud.jarTxns[jid]=Cloud.jarTxns[jid].filter(x=>x.id!==id);render();
    toast('已刪除',()=>{jarTxnRef(jid,id).set(data).then(()=>toast('已復原')).catch(()=>toast('復原失敗'))});
  }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,id=el.dataset.id;
  switch(a){
    case 'open-add':openAdd('expense');break;
    case 'close':closeSheet();break;
    case 'type':draft.type=el.dataset.t;draft.view=null;sheetRender();break;
    case 'kp':pressKey(el.dataset.k);break;
    case 'kpshow':{const a=document.activeElement;if(a&&a.blur)a.blur();document.getElementById('sheet').classList.remove('kp-hide');break}
    case 'catall':draft.view='cats';sheetRender();document.getElementById('sheet').scrollTop=0;break;
    case 'catback':draft.view=null;sheetRender();break;
    case 'catpick':draft.catId=id;draft.view=null;sheetRender();break;
    case 'cat':draft.catId=id;document.querySelectorAll('.catchip[data-action=cat]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.id===id));updateHint();break;
    case 'save':saveDraft();break;
    case 'tx':openTx(id);break;
    case 'stx':openShared(el.dataset.jid,id);break;
    case 'swdel':swipeDelete(el.dataset.ref);break;
    case 'vertap':verTap();break;
    case 'devopen':openDev('home');break;
    case 'devgo':devView=el.dataset.v;devRender();break;
    case 'devclose':closeDev();break;
    case 'devoff':try{localStorage.setItem(DEV_KEY,'0')}catch(_){}closeDev();render();toast('已關閉開發者模式');break;
    case 'grreset':S.gradeRules=null;persist();devRender(true);toast('已恢復預設條件');break;
    case 'gcadd':{const u=ensureThemeText(el.dataset.t);u.comments[el.dataset.g].push('');persist();devRender(true);const ins=document.querySelectorAll(`#dev [data-edit=gc][data-g="${el.dataset.g}"]`);if(ins.length)ins[ins.length-1].focus();break}
    case 'gcdel':{const u=ensureThemeText(el.dataset.t),l=u.comments[el.dataset.g];if(l.length<=1){toast('每個評等至少要保留一句評語');break}l.splice(+el.dataset.i,1);persist();devRender(true);break}
    case 'tcreset':if(!confirm(`確定把「${THEMES[el.dataset.t].name}」的稱號和評語恢復成預設？`))break;if(S.themeText)delete S.themeText[el.dataset.t];persist();devRender(true);toast('已恢復預設');break;
    case 'themeuse':S.sumTheme=el.dataset.t;persist();devRender(true);toast(`已套用「${THEMES[el.dataset.t].name}」`);break;
    case 'themeprev':{const mk=lastFinishedMonth();if(!mk){toast('還沒有已結束、而且有紀錄的月份可以預覽');break}openSummary(mk,el.dataset.t);break}
    case 'catx':{if(!sumState)break;const k=el.dataset.k;sumState.open.has(k)?sumState.open.delete(k):sumState.open.add(k);rerenderSummary();break}
    case 'catmore':if(sumState){sumState.all.add(el.dataset.k);rerenderSummary()}break;
    case 'bell':openNotice();break;
    case 'nclear':{const n=notice();if(n.v===APP_VERSION)setNotice(Object.assign(n,{cleared:true}));closeSheet();updateBell();break}
    case 'reloadapp':location.reload();break;
    case 'summary':openSummary(listMonth);break;
    case 'sumclose':closeSummary();break;
    case 'settle':{settleOpen=!settleOpen;const s=el.closest('.settle');s.classList.toggle('open',settleOpen);el.setAttribute('aria-expanded',settleOpen);break}
    case 'qclear':{listQuery='';const i=document.getElementById('lq');if(i){i.value='';i.focus()}document.getElementById('sbox').classList.add('empty');refreshResults();break}
    case 'qall':listAllMonths=!listAllMonths;el.setAttribute('aria-pressed',listAllMonths);refreshResults();break;
    case 'emopick':openEmoji(id,el.dataset.jid);break;
    case 'emoset':applyEmoji(el.dataset.e);break;
    case 'emocustom':{const v=lastEmoji(document.getElementById('emocustom').value);if(!v){toast('請輸入一個 emoji');break}applyEmoji(v);break}
    case 'undo':{const f=undoFn;undoFn=null;document.getElementById('toast').classList.remove('show','act');if(f)f();break}
    case 'delstx':if(!confirm('確定刪除這筆紀錄？'))break;jarTxnRef(el.dataset.jid,id).delete().catch(()=>toast('刪除失敗'));closeSheet();render();toast('已刪除');break;
    case 'newjar':createJar();break;
    case 'invite':inviteTo(el.dataset.jid);break;
    case 'uninvite':cancelInvite(id);break;
    case 'accept':acceptInvite(id);break;
    case 'decline':declineInvite(id);break;
    case 'leavejar':leaveJar(el.dataset.jid);break;
    case 'deljar':deleteJar(el.dataset.jid);break;
    case 'rmmember':removeMember(el.dataset.jid,id);break;
    case 'verify':sendVerify();break;
    case 'verified':checkVerified();break;
    case 'jcolor':{const j=Cloud.jars[el.dataset.jid];if(!j)break;j.color=PALETTE[(PALETTE.indexOf(j.color)+1)%PALETTE.length];saveJarMeta(el.dataset.jid,['color']);render();break}
    case 'jaddc':{const j=Cloud.jars[el.dataset.jid];if(!j)break;j.categories=(j.categories||[]).concat([{id:uid(),emoji:'🏷️',name:'新分類'}]);saveJarMeta(el.dataset.jid,['categories']);render();break}
    case 'jdelc':{const j=Cloud.jars[el.dataset.jid];if(!j)break;j.categories=(j.categories||[]).filter(c=>c.id!==id);saveJarMeta(el.dataset.jid,['categories']);render();break}
    case 'deltx':if(!confirm('確定刪除這筆紀錄？'))break;removeTxn(id);closeSheet();render();toast('已刪除');break;
    case 'mshift':listMonth=shiftMonth(listMonth,+el.dataset.d);listCat=null;resetPie();render();break;
    case 'tolist':listBucket='all';tab='list';render();window.scrollTo(0,0);break;
    case 'pie':{const k=el.dataset.key;if(listBucket==='all'){listBucket=k;listCat=null;resetPie()}else listCat=listCat===k?null:k;render();break}
    case 'jump':listBucket=el.dataset.bucket;listCat=null;resetPie();tab='list';render();window.scrollTo(0,0);break;
    case 'lb':listBucket=el.dataset.b;listCat=null;resetPie();render();break;
    case 'color':{const b=bucketById(id);b.color=PALETTE[(PALETTE.indexOf(b.color)+1)%PALETTE.length];persist();render();break}
    case 'allocmode':setAllocMode(el.dataset.m);break;
    case 'addb':S.buckets.push({id:'b_'+uid(),name:'新罐子',pct:0,amt:0,color:PALETTE[S.buckets.length%PALETTE.length]});persist();render();break;
    case 'delb':{
      const used=S.txns.some(t=>t.bucketId===id||(t.type==='income'&&t.mode==='one'&&t.target===id)||t.from===id||t.to===id)||S.categories.some(c=>c.bucketId===id)||Object.values(S.jarPlan||{}).some(jp=>(jp.hist||[]).some(x=>x.src===id&&+x.amt>0));
      if(S.buckets.length<=1){toast('至少要保留一個罐子');break}
      if(used){toast('這個罐子有紀錄或分類在用，先把分類改到別的罐子');break}
      S.buckets=S.buckets.filter(b=>b.id!==id);if(S.remainderId===id)S.remainderId=S.buckets[S.buckets.length-1].id;persist();render();break}
    case 'addc':S.categories.push({id:uid(),emoji:'🏷️',name:'新分類',bucketId:S.buckets[0].id});persist();render();break;
    case 'delc':S.categories=S.categories.filter(c=>c.id!==id);persist();render();break;
    case 'export':exportData();break;
    case 'csv':exportCSV();break;
    case 'import':document.getElementById('importFile').click();break;
    case 'reset':if(confirm(cloudOn()?'確定清除所有紀錄與設定？雲端帳本也會一起清空，無法復原。':'確定清除所有紀錄與設定？這個動作無法復原。')){replaceAll(defaults());toast('已清除')}break;
    case 'auth':authDo(el.dataset.k);break;
    case 'signout':signOutCloud();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='lq'){listQuery=t.value;document.getElementById('sbox').classList.toggle('empty',!t.value);refreshResults();return}
  if(t.id==='emocustom'){const v=lastEmoji(t.value);if(t.value!==v)t.value=v;return}
  if(t.dataset.edit==='gc'){const u=ensureThemeText(t.dataset.t);u.comments[t.dataset.g][+t.dataset.i]=t.value;persist();return}
  if(t.dataset.edit==='tt'){const u=ensureThemeText(t.dataset.t);u.titles[t.dataset.g]=t.value;persist();return}
  if(draft){
    if(t.id==='amt'){t.value=t.value.replace(/[^0-9]/g,'');draft.amount=t.value;updateHint();return}
    if(t.id==='note'){draft.note=t.value;return}
  }
  const ed=t.dataset.edit;if(!ed||ed==='bcarry')return;
  if(ed==='jname'||ed==='jcemoji'||ed==='jcname'){
    const j=Cloud.jars[t.dataset.jid];if(!j)return;
    if(ed==='jname'){j.name=t.value;saveJarMeta(t.dataset.jid,['name'])}
    else{const c=(j.categories||[]).find(x=>x.id===t.dataset.id);if(!c)return;c[ed==='jcemoji'?'emoji':'name']=t.value;saveJarMeta(t.dataset.jid,['categories'])}
    return;
  }
  if(ed==='jamt'){setJarPlan(t.dataset.jid,'amt',Math.max(0,parseInt(t.value)||0));persist();return}
  if(ed==='bname')bucketById(t.dataset.id).name=t.value;
  if(ed==='bpct'){bucketById(t.dataset.id).pct=Math.max(0,Math.min(100,parseInt(t.value)||0));const sum=targets().reduce((a,b)=>a+b.pct,0);const ps=document.querySelector('.pctsum');if(ps){ps.textContent='合計 '+sum+'%'+(sum===100?'':'，建議調整到 100%（目前會依比例換算）');ps.classList.toggle('bad',sum!==100)}}
  if(ed==='bamt'){bucketById(t.dataset.id).amt=Math.max(0,parseInt(t.value)||0);const ps=document.querySelector('#plansum b');if(ps)ps.textContent=money(planSum())}
  if(ed==='cemoji')catById(t.dataset.id).emoji=t.value;
  if(ed==='cname')catById(t.dataset.id).name=t.value;
  persist();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='importFile'&&t.files[0]){importData(t.files[0]);t.value='';return}
  if(t.id==='lm'||t.id==='hm'){listMonth=t.value||curMonth();listCat=null;resetPie();render();return}
  if(t.dataset.edit==='bcarry'){bucketById(t.dataset.id).carry=t.checked;persist();render();return}
  if(draft){
    if(t.id==='date'){draft.date=t.value;updateHint();return}
    if(t.id==='mode'){draft.mode=t.value;document.getElementById('tgtWrap').classList.toggle('hidden',t.value!=='one');updateHint();return}
    if(t.id==='tgt'){draft.target=t.value;updateHint();return}
    if(t.id==='from'){draft.from=t.value;updateHint();return}
    if(t.id==='to'){draft.to=t.value;updateHint();return}
  }
  if(t.dataset.edit==='cbucket'){catById(t.dataset.id).bucketId=t.value;persist();render()}
  if(t.dataset.edit==='gr'){
    const r=gradeRules(),k=t.dataset.k;let v=Math.max(0,parseInt(t.value)||0);
    if(k==='bMaxOver')r.bMaxOver=Math.min(20,v);
    else{v=Math.min(100,v)/100;r[k]=v;
      if(k==='aRate'&&r.aRate>r.sRate){r.aRate=r.sRate;toast('A 的門檻不能高於 S，已調整為相同')}
      if(k==='sRate'&&r.aRate>r.sRate){r.aRate=r.sRate;toast('A 的門檻已一併調低，不能高於 S')}}
    S.gradeRules=r;persist();devRender(true);return}
  if(t.dataset.edit==='sumsort'){try{localStorage.setItem(SORT_KEY,t.value)}catch(_){}rerenderSummary();return}
  if(t.dataset.edit==='motion'){try{localStorage.setItem(MOTION_KEY,t.value)}catch(_){}applyMotion();stopPieSpin();toast('已更新動態效果');return}
  if(t.dataset.edit==='remainder'){S.remainderId=t.value;const b=bucketById(t.value);if(b&&b.carry===false){b.carry=true;toast(`「${b.name}」是指定罐子，已改為結轉`)}persist();render();return}
  if(t.dataset.edit==='jsrc'){setJarPlan(t.dataset.jid,'src',t.value);persist();render();return}
  if(['bname','bpct','bamt','jamt','jname'].includes(t.dataset.edit))render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('dev')){closeDev();return}if(document.getElementById('summary')){closeSummary();return}closeSheet()}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-action]')){e.preventDefault();e.target.click();return}if(e.key==='Enter'&&e.target.id==='lq'){e.preventDefault();e.target.blur();return}if(e.key==='Enter'&&e.target.id==='emocustom'){e.preventDefault();const v=lastEmoji(e.target.value);if(v)applyEmoji(v);else toast('請輸入一個 emoji');return}if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em')){authDo('login');return}if(e.key==='Enter'&&draft&&e.target.tagName==='INPUT'){if(draft.ok&&!hasOp(draft.expr||''))saveDraft();return}
  // physical keyboard on the calculator
  if(draft&&document.getElementById('kp')&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){
    const map={'+':'+','-':'−','*':'×','x':'×','/':'÷','.':'.','Backspace':'del','Enter':'go','=':'go','Delete':'AC'};
    const k=/^\d$/.test(e.key)?e.key:map[e.key];
    if(k){e.preventDefault();pressKey(k)}
  }});
// hide the calculator while typing a note or picking a date; bring it back afterwards
document.addEventListener('focusin',e=>{if(e.target.closest&&e.target.closest('#sheetBody')&&/INPUT|SELECT/.test(e.target.tagName)&&document.getElementById('kp'))document.getElementById('sheet').classList.add('kp-hide')});
document.addEventListener('focusout',e=>{if(!(e.target.closest&&e.target.closest('#sheetBody')))return;setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('#sheetBody')&&/INPUT|SELECT/.test(a.tagName)))document.getElementById('sheet').classList.remove('kp-hide')},60)});
const obs=new MutationObserver(()=>{if(draft&&document.getElementById('hint')&&!document.getElementById('hint').dataset.init){document.getElementById('hint').dataset.init=1;updateHint()}});
obs.observe(document.getElementById('sheetBody'),{childList:true});

init();
